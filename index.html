/* ---------- tampilan dalam v2 (rapi ala iOS, serasi dengan login) ---------- */
[data-theme=light]{--bg:#FFFFFF;--card2:#F2EFEB;--line:#ECE8E3}
[data-theme=light] .card,[data-theme=light] .v2grp,[data-theme=light] .v2lv{border:1px solid var(--line);box-shadow:0 1px 2px rgba(40,25,10,.04)}
[data-theme=light] .v2seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.12)}
header{border-bottom:0;padding:14px 16px 8px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:5px;font-size:13px}
.lz{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;flex-shrink:0}.lz path{stroke:#C2733F}
[data-theme=light] .lz{background:#17120E}[data-theme=light] .lz path{stroke:#E9A57A}
.frbtn{border:0!important;background:none!important;width:38px;height:38px;margin-right:2px}
.card{border-radius:16px}
.nm{margin:6px 4px 12px}
.v2lv{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.v2big{font-family:Georgia,"Times New Roman",serif;font-size:46px;font-weight:700;color:var(--ac);line-height:1;min-width:34px;text-align:center}
.v2k{font-size:11.5px;font-weight:600;color:var(--mu)}.v2k.o{color:var(--ac);letter-spacing:1.8px;text-transform:uppercase;font-size:11px;font-weight:700}
.v2lv b{display:block;font-size:17px;margin:1px 0 9px}
.v2lv .bar,.v2grp .bar{height:4px;margin-top:0;background:var(--card2)}.v2grp .bar{margin-top:10px}
.v2r{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:7px}
.v2lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mu);margin:24px 4px 8px;text-transform:uppercase;letter-spacing:.3px}
.v2lbl span+span{text-transform:none;letter-spacing:0}
.v2grp{background:var(--card);border-radius:18px;overflow:hidden}.v2pad{padding:14px 16px}
.v2row{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;cursor:pointer;transition:background .15s}
.v2row+.v2row:before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.v2row:active{background:var(--card2)}
.v2row b{font-size:15.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2row .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2row.lk{opacity:.42;cursor:default}.v2row.lk:active{background:none}
.v2n{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;color:var(--ac);width:32px;text-align:center;flex-shrink:0}
.v2ic{width:32px;height:32px;border-radius:9px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex-shrink:0}
.v2ic .svi{display:block}
.v2pct{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:700;color:var(--ac);line-height:1}
.v2pc{font-size:14px;font-weight:600;color:var(--mu);flex-shrink:0}.v2pc.on{color:var(--ac)}
.v2ch{color:var(--mu);opacity:.6;display:flex;flex-shrink:0}.v2ch .svi{display:block}
.v2ttl{padding:2px 4px 0}.v2ttl h1{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin:4px 0 0}
.v2seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--card2);border-radius:12px;padding:3px;margin:16px 0}
.v2seg button{border:0;background:none;padding:8px 2px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
.v2seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
[data-theme=dark] .v2seg button.on,:root:not([data-theme=light]) .v2seg button.on{background:#38332F}
.v2seg button.lock{opacity:.4;cursor:default}.v2seg .svi{vertical-align:-1px}
header .logo.pt{letter-spacing:0}.logo .v2pt{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--tx)}
button.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--ac);font-size:16px;font-weight:500;gap:2px;min-height:36px}
button.back .svi{width:20px;height:20px}
button.back:hover{border:0;color:var(--ac);opacity:.75}button.back:active{transform:none;background:none;border:0;opacity:.45}
.bnav{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.bnav button{padding:9px 4px 12px;font-size:10.5px;font-weight:600;gap:4px}
.bnav svg{width:25px;height:25px}
.bnav button:active svg{transform:scale(.88)}.bnav svg{transition:transform .15s}.bnav button.on span{font-weight:700}
/* di browser (bukan aplikasi terpasang): tanggal, judul, dan kartu naik */
@media (display-mode:browser){.lg-kick{margin-top:18px}.lg-top>h1{margin-top:8px}.lg-sheet{min-height:0}}
/* ---------- tampilan laptop (layar lebar): menu di kiri, login dibagi dua ---------- */
.bnav .sb-logo,.lg-st{display:none}
@media (min-width:900px){
 .app:not(.islogin){max-width:none;padding-left:240px}
 .app:not(.islogin) header{width:100%;max-width:960px;margin:0 auto;padding:22px 40px 6px}
 .app:not(.islogin) main{width:100%;max-width:960px;margin:0 auto;padding:16px 40px 48px}
 header .logo:not(.pt){visibility:hidden}
 .bnav{top:0;bottom:0;left:0;right:auto;width:240px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:24px 14px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
 .app.islogin{max-width:none}
 .bnav .sb-logo{display:flex;max-width:none;width:auto;align-items:center;gap:9px;font-weight:800;letter-spacing:5px;font-size:13px;padding:2px 10px 26px;color:var(--tx)}
 .bnav>#bnavIn{flex-direction:column;max-width:none;gap:4px}
 .bnav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:11px 14px;border-radius:12px;font-size:14.5px;transition:background .15s,color .15s}
 .bnav button svg{width:22px;height:22px}
 .bnav button:hover{background:var(--card2);color:var(--tx)}
 .bnav button.on,.bnav button.on:hover{background:var(--acs);color:var(--ac)}
 .toast{bottom:28px}
 /* login dibagi dua */
 html.lgv .lg{flex-direction:row;height:100%;min-height:560px}
 .lg-top{flex:1 1 55%;position:relative;justify-content:center;padding:96px 7vw 56px}
 .lg-bar{position:absolute;top:28px;left:7vw;right:7vw}
 .lg h1{font-size:clamp(44px,4.6vw,64px)}
 .lg-stack{width:min(100%,440px);height:150px;max-height:150px;margin:44px 12px 0}
 .lg-w{font-size:36px}
 .lg-sheet{flex:0 0 45%;max-width:620px;min-height:0;margin:0;border-radius:0;border-top:0;border-left:1px solid var(--lgfb);box-shadow:none;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(40px,6vw,96px)}
 [data-theme=light] .lg-sheet{box-shadow:none;background:#FBF9F7}
 .lg-handle{display:none}
 .lg-st{display:block;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:-.6px;margin-bottom:22px}
 .lg-st:empty{display:none}
 .lg-inst{margin-top:16px}
}
@media (min-width:900px) and (display-mode:browser){.lg-kick{margin-top:30px}}
@media (prefers-reduced-motion:reduce){.lg *,.lg *:before,.lg *:after{animation:none!important;transition:none!important}}

/* mobile: konten lebih mepet ke tepi layar */
@media (max-width:899px){:root{--px:10px}
.app:not(.islogin) main{padding-left:var(--px);padding-right:var(--px)}
.app:not(.islogin) header{padding-left:calc(var(--px) + 4px);padding-right:var(--px)}
.wl{margin-left:calc(-1*var(--px));margin-right:calc(-1*var(--px))}.wl .wi{padding-left:14px;padding-right:14px}
.schips{margin-left:calc(-1*var(--px));margin-right:calc(-1*var(--px));padding-left:var(--px);padding-right:var(--px)}
.slist{margin-left:calc(-1*var(--px));margin-right:calc(-1*var(--px))}.sr{padding-left:var(--px);padding-right:var(--px)}}
</style>
</head>

async function fetchAll(table,cols,order='id'){let out=[],from=0;
  for(;;){const{data,error}=await sb.from(table).select(cols).order(order).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out}
async function invokeAdmin(body){const{data,error}=await sb.functions.invoke('zetoro-admin',{body});
  if(error){let msg=t('errGeneric');try{const j=await error.context.json();if(j&&j.error)msg=j.error}catch(e){}throw new Error(msg)}
  if(data&&data.error)throw new Error(data.error);return data}

function lvlOf(n){let i=0;LEVELS.forEach((l,j)=>{if(n>=l[0])i=j});const nx=LEVELS[i+1];
  return{i:i+1,name:t('lvn'+(i+1)),pct:nx?(n-LEVELS[i][0])/(nx[0]-LEVELS[i][0]):1,left:nx?nx[0]-n:0}}

async function signFotos(){const ppl=[S.user,...DB.students,...(DB.friends||[])].filter(p=>p&&p.foto&&!FOTO[p.foto]);const paths=[...new Set(ppl.map(p=>p.foto))];if(!paths.length)return;

function avatar(p,size=32){const url=p&&p.foto&&FOTO[p.foto];const ch=esc(((p&&p.nama)||'?').trim().charAt(0).toUpperCase());
  return url?`<img class="avi" src="${esc(url)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`:`<span class="avi avt" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px">${ch}</span>`}
function ringAv(p,pct,lvl,size=52){return `<div class="rav" style="width:${size}px;height:${size}px">${ring(pct,'',size)}<div class="rav-in">${avatar(p,size-14)}</div><span class="rav-lv">${lvl}</span></div>`}

async function loadData(){
  const uid=S.user.id;
  const [babs,words]=await Promise.all([fetchAll('babs','id,nama'),fetchAll('words','id,bab_id,kata,arti,contoh,contoh_arti,tanda,created_at')]);
  DB.grammars=await fetchAll('grammars','id,key,judul,level,grup,rumus,penjelasan,detail,contoh,audio_path,audio_dur,kunci');gIdx();
  DB.wa='';try{const{data}=await sb.from('app_settings').select('value').eq('key','wa').maybeSingle();DB.wa=(data&&data.value)||''}catch(e){console.warn(e)}
  DB.gstats={};try{(await fetchAll('grammar_stats','student_id,grammar_key,benar,total','grammar_key')).forEach(r=>{(DB.gstats[r.student_id]=DB.gstats[r.student_id]||{})[r.grammar_key]=r})}catch(e){console.warn(e)}
  DB.babs=babs.map(b=>({...b,words:words.filter(w=>w.bab_id===b.id)}));
  const [unl,sts,qz]=await Promise.all([fetchAll('unlocks','student_id,bab_id,paket','bab_id'),fetchAll('statuses','student_id,word_id,status','word_id'),fetchAll('quiz_results','student_id,bab_id,paket,last,best,tries','bab_id')]);
  let studs;
  if(S.role==='teacher'){const{data,error}=await sb.from('profiles').select('id,nama,username,foto,bio,glevel,last_seen,created_at,no_hp').eq('role','student').order('created_at');if(error)throw error;studs=data}
  else studs=[{id:uid,nama:S.user.nama,username:S.user.username,foto:S.user.foto,bio:S.user.bio||'',glevel:S.user.glevel,glevel_seen:S.user.glevel_seen}];
  DB.students=studs.map(p=>({...p,unlocked:{},status:{},quiz:{}}));
  const byId=Object.fromEntries(DB.students.map(s=>[s.id,s]));
  unl.forEach(u=>{if(byId[u.student_id])byId[u.student_id].unlocked[u.bab_id]=u.paket});
  sts.forEach(x=>{if(byId[x.student_id])byId[x.student_id].status[x.word_id]=x.status});
  qz.forEach(q=>{if(byId[q.student_id])byId[q.student_id].quiz[q.bab_id+'-'+q.paket]={last:q.last,best:q.best,tries:q.tries}});
  if(S.role==='student')S.user=byId[uid];
  if(!S.mBab&&DB.babs[0])S.mBab=DB.babs[0].id;
  await signFotos();
}
async function enterApp(session){
  const{data:prof,error}=await sb.from('profiles').select('id,role,nama,username,foto,bio,glevel,glevel_seen').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!prof){await sb.auth.signOut();throw new Error(t('notStudent'))}
  S.role=prof.role;S.user=prof;
  await loadData();
  if(S.role==='teacher'){S.view='admin';S.aTab='sum';S.gStudent=DB.students[0]?.id||null}else{S.view='home';glNotify()}
  presStart();
  if(S.role==='student'){loadFriends();clearInterval(S.frIv);S.frIv=setInterval(()=>{if(document.visibilityState==='visible')loadFriends()},60000)}
}

  [/ing\b/i,['ing','sedang','berlangsung','sekarang']],[/\bv2\b|past|lampau|masa lalu/i,['lampau','masa lalu','kemarin','v2','sudah terjadi','yesterday']],
  [/\bam\b|\bis\b|\bare\b|to be/i,['to be','am','is','are']],[/pronoun|kata ganti/i,['subjek','kata ganti','pronoun','pelaku']],
  [/preposition|kata depan|tempat/i,['tempat','di dalam','di atas','preposition','kata depan']],[/article|\ba\s*\/\s*an\b/i,['huruf mati','huruf hidup','vokal','konsonan','satu','benda']]];

  <div class="field"><label>${t('gLong')}</label><textarea id="${p}_d" rows="4">${v('detail')}</textarea></div>

function aGram(){const todo=DB.babs.flatMap(b=>b.words).filter(w=>!(w.tanda&&w.tanda.length));
  return `<h1>${t('grammar')}</h1>
  ${fold('gadd',t('addGram'),gForm(null))}
  ${fold('gpaste',t('pasteGram'),`<p class="sm mu" style="margin:0 0 8px">${t('pasteGramHint')}</p><button class="btn ghost sm2" style="margin-bottom:10px" onclick="copyGramPrompt()">${t('copyPrompt')}</button>
    <textarea id="gpb" placeholder="Simple Present | 1 | tense | he/she/it + verb-s | … | … | She goes to school."></textarea><div style="height:10px"></div><button class="btn" type="button" onclick="pasteGrams()">${t('save')}</button>`)}
  ${fold('gmark',t('markOld'),todo.length?`<p class="sm mu" style="margin:0 0 8px"><b>${todo.length}</b> ${t('markOldHint')}</p><button class="btn ghost sm2" style="margin-bottom:10px" onclick="copyMarkPrompt()">${t('copyPrompt')}</button>
    <textarea id="mkb" placeholder="${t('markPaste')}"></textarea><div style="height:10px"></div><button class="btn" type="button" onclick="pasteMarks()">${t('save')}</button>`:`<p class="sm mu" style="margin:0">${t('markOldNone')}</p>`)}
  ${legend()}<p class="sm mu" style="margin:6px 0 0">${t('warnHint')} <b>${t('lv'+topGL())}</b>.</p>${gramList(DB.grammars,null,true)}`}
function slugKey(j){let k=j.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,34);if(k.length<2)k='g-'+k;let x=k,n=2;while(GB[x])x=k+'-'+n++;return x}
function gRead(p){return{judul:$(p+'_j').value.trim().slice(0,80),level:+$(p+'_l').value,grup:$(p+'_g').value,rumus:$(p+'_r').value.trim().slice(0,600),penjelasan:$(p+'_s').value.trim().slice(0,400),detail:$(p+'_d').value.trim().slice(0,3000),contoh:$(p+'_c').value.trim().slice(0,1000),kunci:($(p+'_k')?$(p+'_k').value.trim().slice(0,300):'')||null}}
const GCOLS='id,key,judul,level,grup,rumus,penjelasan,detail,contoh,audio_path,audio_dur,kunci';
async function saveGram(key){const v=gRead(key?'ge':'gf');if(!v.judul||!v.penjelasan){toast(t('fill'));return}
  if(key){if(!await ask(t('askSave'),`<b>${esc(v.judul)}</b>. ${t('askSaveMsg')}`,t('save')))return;
    const ok=await run(async()=>{const{error}=await sb.from('grammars').update(v).eq('key',key);if(error)throw error;Object.assign(GB[key],v);gIdx()});if(ok){S.gOpen=null;toast(t('gramSaved'))}}
  else{const ok=await run(async()=>{const{data,error}=await sb.from('grammars').insert({...v,key:slugKey(v.judul)}).select(GCOLS).single();if(error)throw error;DB.grammars.push(data);gIdx()});
    if(ok){toast('1 '+t('gramAdded'));['_j','_r','_s','_d','_c'].forEach(x=>$('gf'+x).value='')}}
  render()}
async function delGram(key){const g=GB[key];if(!await ask(t('askDelGram'),`<b>${esc(g.judul)}</b> ${t('askDelGramMsg')}`,t('del'),true))return;
  const ok=await run(async()=>{const{error}=await sb.from('grammars').delete().eq('key',key);if(error)throw error;DB.grammars=DB.grammars.filter(x=>x.key!==key);gIdx()});
  if(ok){S.gOpen=null;toast(t('gramDeleted'))}render()}
function copyText(txt){try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(txt,6000))}catch(e){toast(txt,6000)}}
function copyGramPrompt(){copyText(`Buatkan materi grammar bahasa Inggris untuk pelajar Indonesia tentang [TOPIK GRAMMAR]. Tampilkan satu baris per materi, TANPA header, dengan 7 kolom dipisah tanda |:\nJudul | Level (1 = pemula, 2 = menengah, 3 = lanjut) | Kelompok (tense / pronoun / tobe / prep / other) | Rumus singkat | Penjelasan singkat 1–2 kalimat (bahasa Indonesia) | Penjelasan lengkap satu paragraf (bahasa Indonesia) | 3 contoh kalimat dipisah titik koma\n\nJangan buat materi yang sudah ada: ${DB.grammars.map(g=>g.judul).join(', ')}`)}
function lvlOfTxt(x){x=norm(x);if(/^(1|pemula|beginner|dasar)/.test(x))return 1;if(/^(2|menengah|intermediate)/.test(x))return 2;if(/^(3|lanjut|advanced)/.test(x))return 3;return 1}
async function pasteGrams(){const rows=parse($('gpb').value).filter(p=>p.length>=5);if(!rows.length){toast(t('nothing'));return}
  const have=new Set(DB.grammars.map(g=>norm(g.judul)));let dup=0;const keys=new Set();
  const list=rows.filter(p=>{if(have.has(norm(p[0]))){dup++;return false}have.add(norm(p[0]));return true}).map(p=>{let k=slugKey(p[0]);while(keys.has(k))k+='-x';keys.add(k);
    const g=norm(p[2]);return{key:k,judul:p[0].slice(0,80),level:lvlOfTxt(p[1]),grup:GRP.includes(g)?g:(/to ?be/.test(g)?'tobe':/prep/.test(g)?'prep':/pronoun/.test(g)?'pronoun':/tense/.test(g)?'tense':'other'),
      rumus:(p[3]||'').slice(0,600),penjelasan:(p[4]||'').slice(0,400),detail:(p[5]||'').slice(0,3000),contoh:(p.slice(6).join(' | ')).split(/\s*;\s*/).filter(Boolean).join('\n').slice(0,1000)}});
  if(!list.length){toast(`${dup} ${t('dupSkip')}`,3500);return}
  const ok=await run(async()=>{const{data,error}=await sb.from('grammars').insert(list).select(GCOLS);if(error)throw error;DB.grammars.push(...data);gIdx()});
  if(ok){$('gpb').value='';toast(`${list.length} ${t('gramAdded')}${dup?` · ${dup} ${t('dupSkip')}`:''}`,3500)}render()}
function copyMarkPrompt(){const todo=DB.babs.flatMap(b=>b.words).filter(w=>!(w.tanda&&w.tanda.length)).slice(0,150);
  copyText(`Berikut contoh kalimat bahasa Inggris dengan nomor ID. Tulis ulang SETIAP kalimat persis sama (jangan ubah, tambah, atau hapus kata apa pun), tetapi tandai bagian kalimat yang menunjukkan grammar (maksimal 2 untuk grammar Pemula, 3 jika ada grammar Menengah, 4 jika ada grammar Lanjut).${gramRule(3)}\n\nJawab satu baris per kalimat dengan format: ID | kalimat bertanda. Tanpa header, tanpa penjelasan. Kalau tidak ada grammar yang cocok, tulis kalimatnya tanpa tanda.\n\n${todo.map(w=>`${w.id} | ${w.contoh}`).join('\n')}`)}
async function pasteMarks(){const lines=$('mkb').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const all=Object.fromEntries(DB.babs.flatMap(b=>b.words).map(w=>[w.id,w]));
  const ups=[];let bad=0;lines.forEach(l=>{const m=/^\|?\s*(\d+)\s*(?:\||\t)\s*(.+?)\s*\|?$/.exec(l);if(!m)return;const w=all[+m[1]];if(!w){bad++;return}
    const pm=parseMarks(m[2]);if(norm(pm.plain).replace(/[^\w' ]/g,'')!==norm(w.contoh).replace(/[^\w' ]/g,'')){bad++;return}const tanda=cleanMarks(w.contoh,pm.marks);if(tanda)ups.push([w,tanda])});
  if(!ups.length){toast(bad?`${bad} ${t('mismatch')}`:t('nothing'),3500);return}
  const ok=await run(async()=>{for(let i=0;i<ups.length;i+=8){const res=await Promise.all(ups.slice(i,i+8).map(([w,tanda])=>sb.from('words').update({tanda}).eq('id',w.id)));
    const e=res.find(r=>r.error);if(e)throw e.error;ups.slice(i,i+8).forEach(([w,tanda])=>w.tanda=tanda)}});
  if(ok){$('mkb').value='';toast(`${ups.length} ${t('marked')}${bad?` · ${bad} ${t('mismatch')}`:''}`,4000)}render()}

   act=ids.map(bid=>bab(bid)?`${esc(bab(bid).nama)} · ${t('paket')} ${s.unlocked[bid]}`:'').filter(Boolean).join(', ')||'—';
   return `<div class="card bab" onclick="openGrade('${s.id}',${ids.length?ids[ids.length-1]:(DB.babs[0]?.id||0)})">${ringAv(s,L.pct,L.i,54)}<div class="grow"><b>${esc(s.nama)}</b> <span class="sm mu">@${esc(s.username)}</span>
   <div class="sm mu">${t('activePkg')}: ${act}</div><div class="sm mu">${n} ${t('total')}</div></div><span class="mu">›</span></div>`}).join(''):`<div class="card mu">${t('noStudents')}</div>`}`}

   `<button class="btn" onclick="unlockBab('${s.id}',${b.id})">${t('openBab')}: ${esc(b.nama)}</button>`}

function gRecap(s){const st=DB.gstats[s.id]||{},list=DB.grammars.filter(g=>st[g.key]&&st[g.key].total);
  return `<h2>${t('grammar')} <span class="sm mu" style="font-weight:400">· ${t('glLabel')}: ${t('lv'+(s.glevel||1))}</span></h2>${list.length?`<div class="card" style="padding:6px 14px">${list.map(g=>{const r=st[g.key],p=Math.round(r.benar/r.total*100);return `<div class="grc g-${g.grup}"><i class="gdot"></i><span class="grow">${esc(g.judul)} <span class="lvb">${t('lv'+g.level)}</span></span><span class="sm">${r.benar}/${r.total}</span><div class="gbar"><i style="width:${p}%"></i></div>${gBadge(r)||'<span class="gbd mu">–</span>'}</div>`}).join('')}</div><p class="sm mu">${t('recapHint')}</p>`:`<div class="card mu">${t('noGramData')}</div>`}`}
async function unlockPk(sid,bid){const s=DB.students.find(x=>x.id===sid),b=bab(bid),m=s.unlocked[bid];
  if(!(b.words.length>m*20)){toast(t('noMorePkg'),3000);return}
  const ok=await run(async()=>{const{error}=await sb.from('unlocks').upsert({student_id:sid,bab_id:bid,paket:m+1});if(error)throw error});
  if(ok){s.unlocked[bid]=m+1;toast(`${t('paket')} ${m+1} — ${t('opened')} ${s.nama}`)}render()}
async function unlockBab(sid,bid){const s=DB.students.find(x=>x.id===sid),b=bab(bid);if(!b.words.length){toast(t('empty'));return}
  const ok=await run(async()=>{const{error}=await sb.from('unlocks').upsert({student_id:sid,bab_id:bid,paket:1});if(error)throw error});
  if(ok){s.unlocked[bid]=1;S.gBab=bid;toast(`${b.nama} — ${t('opened')} ${s.nama}`)}render()}

  ${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn" type="button" onclick="addStu()">${t('save')}</button></div>`)}`}
async function addStu(){const n=$('sn').value.trim(),u=$('su').value.trim().toLowerCase(),p=normHp($('sp').value);
  if(!n||!u||!p){S.err=t('fill');return render()}
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){S.err='Username 3–20 karakter: huruf kecil, angka, titik, atau garis bawah.';return render()}
  if(!/^0\d{8,14}$/.test(p)){S.err=t('hpBad');return render()}
  if(DB.students.some(x=>x.no_hp===p)){S.err=t('hpDup');return render()}
  S.err='';const ok=await run(async()=>{await invokeAdmin({action:'create_student',nama:n,username:u,no_hp:p});await loadData()});
  if(ok){S.pinShow={nama:n,username:u,pin:p};toast(t('added'))}render()}
async function resetPin(id){const s=DB.students.find(x=>x.id===id);
  const v=await askInput(t('askReset'),`${esc(s.nama)} (@${esc(s.username)}) ${t('askResetHp')}`,t('resetPin'),'081234567890',s.no_hp||'');if(v===null)return;
  const hp=normHp(v);if(!/^0\d{8,14}$/.test(hp)){toast(t('hpBad'),3200);return}
  if(DB.students.some(x=>x.id!==id&&x.no_hp===hp)){toast(t('hpDup'),3200);return}
  const ok=await run(async()=>{await invokeAdmin({action:'reset_pin',student_id:id,no_hp:hp})});
  if(ok){s.no_hp=hp;S.pinShow={nama:s.nama,username:s.username,pin:hp};toast(t('pinReset'))}render()}

  if(st.sel&&(i===st.sel[1]+1))st.sel=[st.sel[0],i];else if(st.sel&&i===st.sel[0]-1)st.sel=[i,st.sel[1]];else if(st.sel&&st.sel[0]===i&&st.sel[1]===i)st.sel=null;else st.sel=[i,i];tgRef(k)}
function tgSet(k){const st=S.tgs[k],g=$('tgg_'+k).value,d=$('tgd_'+k).value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,3);
  if(!g||d.length<2){toast(t('tgNeed'));return}const toks=tgSent(k).split(/\s+/).filter(Boolean),tx=tgText(toks,st.sel);if(!tx)return;
  const nx=tgVis(k).filter(m=>norm(m.t)!==norm(tx)).concat([{t:tx,g,d:d.filter(x=>norm(x)!==norm(tx))}]);if(nx.length>tgLimit(nx)){toast(t('tgMax'),3500);return}
  st.marks=nx;st.sel=null;tgRef(k)}
function tgDel(k,tx){const st=S.tgs[k];st.marks=st.marks.filter(m=>m.t!==tx);tgRef(k)}
function norm(x){return String(x||'').toLowerCase().replace(/\s+/g,' ').replace(/[.!?,]+$/,'').trim()}
function dupsOf(kata,exceptId){const k=norm(kata),r=[];DB.babs.forEach(b=>b.words.forEach(w=>{if(w.id!==exceptId&&norm(w.kata)===k)r.push({w,b})}));return r}
function dupMsg(kata,d){return `<b>${esc(kata)}</b> ${t('alreadyAs')} ${d.map(x=>`“${esc(x.w.arti)}” (${esc(x.b.nama)})`).join(', ')}. ${t('addAsNew')}`}
function senseNo(w){const k=norm(w.kata),same=[];DB.babs.forEach(b=>b.words.forEach(x=>{if(norm(x.kata)===k)same.push(x.id)}));if(same.length<2)return 0;same.sort((a,b)=>a-b);return same.indexOf(w.id)+1}
function kw(w){const n=senseNo(w);return esc(w.kata)+(n?` <span class="sense">${'①②③④⑤⑥⑦⑧⑨'[n-1]||n}</span>`:'')}
function others(w,ws,n,extra=()=>true){const usedK=new Set([norm(w.kata)]),usedA=new Set([norm(w.arti)]),r=[];
  for(const x of shuffle(ws.filter(x=>x.id!==w.id&&extra(x)))){const k=norm(x.kata),a=norm(x.arti);if(usedK.has(k)||usedA.has(a))continue;usedK.add(k);usedA.add(a);r.push(x);if(r.length>=n)break}return r}
function splitBar(l){const out=[];let cur='',d=0;for(const ch of l){if(ch==='[')d++;else if(ch===']')d=Math.max(0,d-1);if(ch==='|'&&!d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function parse(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^\|?\s*:?-{2,}/.test(l)).map(l=>{l=l.replace(/^\|/,'').replace(/\|$/,'');
  let p=(l.includes('\t')?l.split('\t'):splitBar(l)).map(x=>x.trim().replace(/^\*\*|\*\*$/g,''));if(/^\d+\.?$/.test(p[0])&&p.length>=4)p.shift();return p}).filter(p=>p.length>=2&&p[0]&&!/^(kata|word|no)$/i.test(p[0]))}
function pbSet(v){S.pbKeep=v;try{v?localStorage.setItem('zt-pb',v.slice(0,20000)):localStorage.removeItem('zt-pb')}catch(e){}}
function pbGet(){if(S.pbKeep==null){try{S.pbKeep=localStorage.getItem('zt-pb')||''}catch(e){S.pbKeep=''}}return S.pbKeep}
async function pasteWords(){pbSet($('pb').value);const rows=parse(S.pbKeep);if(!rows.length){toast(t('nothing'));return}
  const valid=rows.filter(p=>(p[2]||'').trim()&&p[1]),skip=rows.length-valid.length,seen=new Set(),fresh=[],exist=[];let inDup=0;
  valid.forEach(p=>{const k=norm(p[0]);if(seen.has(k)){inDup++;return}seen.add(k);const d=dupsOf(p[0]);(d.length?exist:fresh).push(d.length?{p,d}:p)});
  const toRow=p=>{const pm=parseMarks(p[2]);return{bab_id:S.mBab,kata:p[0].slice(0,120),arti:p[1].slice(0,200),contoh:pm.plain.slice(0,400),contoh_arti:p.slice(3).join(' | ').trim().slice(0,400),tanda:cleanMarks(pm.plain,pm.marks)}};
  const ins=async list=>{if(!list.length)return true;return await run(async()=>{const{data,error}=await sb.from('words').insert(list.map(toRow)).select('id,bab_id,kata,arti,contoh,contoh_arti,tanda,created_at');if(error)throw error;
    data.sort((x,y)=>x.id-y.id).forEach(w=>bab(S.mBab).words.push(w))})};
  if(!fresh.length&&!exist.length){toast(`${skip} ${t('skipped')}`,3500);return}
  let added=0;if(fresh.length){if(!await ins(fresh)){render();return}added=fresh.length;pbSet('');const pb=$('pb');if(pb)pb.value=''}
  let extra=0,left=exist.length;
  if(exist.length){render();$('toast').classList.remove('show');const picked=await askPick(exist);if(picked.length&&await ins(picked.map(i=>exist[i].p))){extra=picked.length;left-=picked.length}}
  const parts=[];if(added+extra)parts.push(`${added+extra} ${t('wordsAdded')}`);if(extra)parts.push(`${extra} ${t('asNewSense')}`);
  if(left)parts.push(`${left} ${t('notAdded')}`);if(inDup)parts.push(`${inDup} ${t('dupInPaste')}`);if(skip)parts.push(`${skip} ${t('skipped')}`);
  toast(parts.join(' · ')||t('nothing'),4500);render()}
function askPick(exist){return new Promise(res=>{const o=document.createElement('div');o.className='mdl';
  o.innerHTML=`<div class="mdl-b wide"><b>${t('pickTitle')}</b><p class="sm mu">${t('pickMsg')}</p><div class="pk-l">${exist.map((e,i)=>`<label class="pk-i"><input type="checkbox" data-i="${i}">
    <div><b>${esc(e.p[0])}</b><div class="sm"><span class="mu">${t('oldMeaning')}:</span> ${e.d.map(x=>esc(x.w.arti)).join(', ')}</div><div class="sm"><span class="mu">${t('newMeaning')}:</span> <span style="color:var(--ac)">${esc(e.p[1])}</span></div></div></label>`).join('')}</div>
    <div class="mdl-a"><button class="btn ghost sm2" data-v="0">${t('skipAll')}</button><button class="btn sm2" data-v="1">${t('save')}</button></div></div>`;
  o.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const sel=b.dataset.v==='1'?[...o.querySelectorAll('input:checked')].map(x=>+x.dataset.i):[];o.remove();res(sel)};
  document.body.appendChild(o)})}
async function saveWord(){const k=$('ek').value.trim(),a=$('ea').value.trim(),c=$('ec').value.trim(),ca=$('eca').value.trim().slice(0,400);if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const id=S.editWord,w0=bab(S.mBab).words.find(x=>x.id===id);const tanda=cleanMarks(c,(S.tgs&&S.tgs['e'+id]||{}).marks);
  if(w0.kata===k&&w0.arti===a&&w0.contoh===c&&(w0.contoh_arti||'')===ca&&JSON.stringify(w0.tanda||null)===JSON.stringify(tanda)){S.editWord=null;render();return}
  const d=norm(k)!==norm(w0.kata)?dupsOf(k,id):[];
  if(d.length){if(!await ask(t('dupTitle'),dupMsg(k,d).replace(t('addAsNew'),t('saveAsNew')),t('saveNew')))return}
  else if(!await ask(t('askSave'),`<b>${esc(w0.kata)}</b>${w0.kata!==k?' → <b>'+esc(k)+'</b>':''}. ${t('askSaveMsg')}`,t('save')))return;
  const ok=await run(async()=>{const{error}=await sb.from('words').update({kata:k,arti:a,contoh:c,contoh_arti:ca,tanda}).eq('id',id);if(error)throw error;
    const w=bab(S.mBab).words.find(x=>x.id===id);Object.assign(w,{kata:k,arti:a,contoh:c,contoh_arti:ca,tanda})});
  if(ok){S.editWord=null;toast(t('wordSaved'))}render()}
async function delWord(){const id=S.editWord,w0=bab(S.mBab).words.find(x=>x.id===id);if(!await ask(t('askDelWord'),`<b>${esc(w0.kata)}</b> ${t('askDelWordMsg')}`,t('del'),true))return;const ok=await run(async()=>{const{error}=await sb.from('words').delete().eq('id',id);if(error)throw error;const b=bab(S.mBab);b.words=b.words.filter(x=>x.id!==id)});
  if(ok){S.editWord=null;toast(t('wordDeleted'))}render()}
function topGL(){return Math.max(1,...DB.students.map(x=>x.glevel||1))}
function focusChips(){const L=S.pLvl||1,f=S.pFocus||[];return DB.grammars.filter(g=>g.level<=L).map(g=>{const z=!gUse(g.key)&&g.level<=topGL();return `<button type="button" class="fchip g-${g.grup} ${f.includes(g.key)?'on':''}" onclick="togFocus('${g.key}')">${z?'⚠ ':''}${esc(g.judul)}</button>`}).join('')+`<div class="sm mu" style="width:100%;margin-top:2px">${t('focusHint')}</div>`}
function togFocus(k){let f=S.pFocus||[];if(f.includes(k))f=f.filter(x=>x!==k);else{if(f.length>=3){toast(t('focusMax'));return}f=[...f,k]}S.pFocus=f;$('pfoc').innerHTML=focusChips()}
function gramRule(maxLvl){const gl=DB.grammars.filter(g=>g.level<=maxLvl);if(!gl.length)return'';
  return `\n\nTANDAI GRAMMAR di contoh kalimat: tandai bagian kalimat yang menunjukkan grammar dari daftar di bawah (maksimal 2 untuk grammar Pemula, 3 jika ada grammar Menengah, 4 jika ada grammar Lanjut), dengan format [teks|kode|3 pilihan salah dipisah koma]. Contoh: She [goes|simple-present|go,going,went] to the park. Teks di dalam tanda harus persis sama dengan kata di kalimat. Pilihan salah harus bentuk lain dari kata itu yang masuk akal tapi salah untuk kalimat tersebut. Hanya pakai kode berikut:\n${gl.map(g=>`${g.key} = ${g.judul}`).join('\n')}`}
const PLVL={1:['pemula (beginner)','kata sehari-hari yang paling dasar','sangat sederhana, 3–6 kata'],2:['menengah (intermediate)','kata yang lebih beragam, termasuk phrasal verb umum','sedang, 6–10 kata'],3:['lanjut (advanced)','kata dan ungkapan yang lebih sulit, idiom ringan, kata formal','lebih panjang dan natural, 8–15 kata']};
function copyPrompt(){const L=PLVL[S.pLvl||1],m=!!S.pSense;
  const byK={};DB.babs.forEach(b=>b.words.forEach(w=>{const k=w.kata.trim();(byK[k]=byK[k]||[]).push(w.arti)}));const ks=Object.keys(byK);
  let txt=`Buatkan 20 vocabulary bahasa Inggris tentang [TOPIK] untuk tingkat ${L[0]}: ${L[1]}. Tampilkan dalam bentuk tabel 4 kolom TANPA header: Kata Inggris | Arti Indonesia | Contoh kalimat (${L[2]}) | Arti contoh kalimat dalam bahasa Indonesia.`;
  if(ks.length)txt+=m?`\n\nKata-kata berikut sudah pernah dipelajari beserta artinya (${ks.length} kata). Kamu BOLEH memakai kata yang sama HANYA jika maknanya berbeda dari arti yang tertulis, dan contoh kalimatnya harus jelas menunjukkan makna baru itu. Selain itu, jangan ulangi kata-kata ini:\n${ks.map(k=>`${k} (${byK[k].join('; ')})`).join(', ')}`
    :`\n\nJANGAN gunakan kata-kata berikut karena sudah pernah dipelajari (${ks.length} kata):\n${ks.join(', ')}`;
  txt+=gramRule((S.pLvl||1));
  const fk=(S.pFocus||[]).filter(k=>GB[k]);if(fk.length)txt+=`\n\nFOKUS GRAMMAR: minimal 14 dari 20 contoh kalimat HARUS memakai grammar berikut (bagi rata), dan tandai grammar tersebut dengan format di atas: ${fk.map(k=>`${k} = ${GB[k].judul}`).join(', ')}.`;
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(txt,6000))}catch(e){toast(txt,6000)}}

/* ---------- boot ---------- */
function readRole(){try{return location.hash==='#guru'?'teacher':'student'}catch(e){return 'student'}}
window.addEventListener('hashchange',()=>{S.loginTab=readRole();S.err='';if(!S.user)boot()});
async function boot(){S.loginTab=readRole();const wp=loadWod();
  try{
    if(S.loginTab==='teacher'){const{data}=await sb.rpc('teacher_exists');S.needSetup=data===false}
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enterApp(session);render();return}
  }catch(e){console.error(e);await doSignOut()}
  await Promise.race([wp,new Promise(r=>setTimeout(r,1200))]);S.view='login';S.anim=true;render()}
render();boot();
