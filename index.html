async function signFotos(){const ppl=[S.user,...DB.students].filter(p=>p&&p.foto&&!FOTO[p.foto]);const paths=[...new Set(ppl.map(p=>p.foto))];if(!paths.length)return;

function pickFoto(id){S.fotoFor=id;const i=$('fotoIn');i.value='';i.click()}
async function shrink(file){const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u});
  const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}
async function fotoPicked(inp){const f=inp.files&&inp.files[0],id=S.fotoFor;if(!f||!id)return;const p=personById(id);if(!p)return;
  if(!/^image\//.test(f.type)){toast(t('photoErr'));return}
  const ok=await run(async()=>{const blob=await shrink(f);const path=`${id}/${Date.now()}.jpg`;
    const{error:e1}=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(e1)throw e1;
    const{error:e2}=await sb.from('profiles').update({foto:path}).eq('id',id);if(e2)throw e2;
    const old=p.foto;p.foto=path;const twin=DB.students.find(x=>x.id===id);if(twin&&twin!==p)twin.foto=path;if(S.user.id===id)S.user.foto=path;
    await signFotos();if(old)sb.storage.from('avatars').remove([old]).catch(()=>{})});
  if(ok)toast(t('photoSaved'));render()}

    p.foto=null;const twin=DB.students.find(x=>x.id===id);if(twin)twin.foto=null;if(S.user.id===id)S.user.foto=null;sb.storage.from('avatars').remove([old]).catch(()=>{})});
  if(ok)toast(t('photoRemoved'));render()}

function ring(pct,label,size=64){const r=size/2-5,C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*Math.max(.02,pct)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/3.2}" font-weight="600" fill="var(--tx)">${label}</text></svg>`}
function toast(m,ms=2200){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms)}
function speak(txt,rate=.85,el){try{const was=!!(el&&el.classList.contains('talking'));stopAudio();if(was)return;
  const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=rate;
  if(el){el.classList.add('talking');el.insertAdjacentHTML('afterbegin','<span class="wave"><i></i><i></i><i></i><i></i></span>');S.talkEl=el;
    const off=()=>{if(S.talkEl===el)clearTalk()};u.onend=off;u.onerror=off;clearTimeout(S.talkT);S.talkT=setTimeout(off,Math.max(4000,txt.length*180/rate))}
  speechSynthesis.speak(u)}catch(e){clearTalk();toast('Audio tidak tersedia')}}
function clearTalk(){const el=S.talkEl;if(el){el.classList.remove('talking');const w=el.querySelector('.wave');if(w)w.remove()}S.talkEl=null}
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}clearTalk();try{if(S.rec)S.rec.abort()}catch(e){}S.rec=null}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- data loading ---------- */
async function loadData(){
  const uid=S.user.id;
  const [babs,words]=await Promise.all([fetchAll('babs','id,nama'),fetchAll('words','id,bab_id,kata,arti,contoh,contoh_arti,created_at')]);
  DB.babs=babs.map(b=>({...b,words:words.filter(w=>w.bab_id===b.id)}));
  const [unl,sts,qz]=await Promise.all([fetchAll('unlocks','student_id,bab_id,paket','bab_id'),fetchAll('statuses','student_id,word_id,status','word_id'),fetchAll('quiz_results','student_id,bab_id,paket,last,best,tries','bab_id')]);
  let studs;
  if(S.role==='teacher'){const{data,error}=await sb.from('profiles').select('id,nama,username,foto,created_at').eq('role','student').order('created_at');if(error)throw error;studs=data}
  else studs=[{id:uid,nama:S.user.nama,username:S.user.username,foto:S.user.foto}];
  DB.students=studs.map(p=>({...p,unlocked:{},status:{},quiz:{}}));
  const byId=Object.fromEntries(DB.students.map(s=>[s.id,s]));
  unl.forEach(u=>{if(byId[u.student_id])byId[u.student_id].unlocked[u.bab_id]=u.paket});
  sts.forEach(x=>{if(byId[x.student_id])byId[x.student_id].status[x.word_id]=x.status});
  qz.forEach(q=>{if(byId[q.student_id])byId[q.student_id].quiz[q.bab_id+'-'+q.paket]={last:q.last,best:q.best,tries:q.tries}});
  if(S.role==='student')S.user=byId[uid];
  if(!S.mBab&&DB.babs[0])S.mBab=DB.babs[0].id;
  await signFotos();
}
async function enterApp(session){
  const{data:prof,error}=await sb.from('profiles').select('id,role,nama,username,foto').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!prof){await sb.auth.signOut();throw new Error(t('notStudent'))}
  S.role=prof.role;S.user=prof;
  await loadData();
  if(S.role==='teacher'){S.view='admin';S.aTab='sum';S.gStudent=DB.students[0]?.id||null}else S.view='home';
}

function maxOpenOf(s,b){return Math.min(s.unlocked[b.id]||0,pakets(b))}
function curWords(b){return S.paket===0?b.words.slice(0,maxOpenOf(S.user,b)*20):pkWords(b,S.paket)}
function qKey(){return S.bab+'-'+(S.paket===0?'all':S.paket)}
function pkLabel(){return S.paket===0?t('allWords'):t('paket')+' '+S.paket}
function pkChips(b,maxOpen){let h=`<button class="chip ${S.paket===0?'on':''}" onclick="selPk(0)">${t('allWords')}</button>`;
  for(let p=1;p<=pakets(b);p++){const lk=p>maxOpen;h+=`<button class="chip ${p===S.paket?'on':''} ${lk?'lock':''}" ${lk?'':`onclick="selPk(${p})"`}>${lk?ic('lock',13):''}${t('paket')} ${p}</button>`}
  return `<div class="chips">${h}</div>`}
function selPk(p){S.paket=p;S.mode='menu';S.fi=0;S.flip=false;render()}
function vBab(){const b=bab(S.bab),s=S.user;if(!b){S.view='home';return vHome()}const maxOpen=maxOpenOf(s,b);
  const head=`<div class="tag">${esc(b.nama)}</div>`;
  if(S.tab==='score')return head+vScore(s,b,false);

  <div class="card bab" onclick="startQuiz()"><div class="n">${icon.check.replace('<svg','<svg width="18" height="18"')}</div><div class="grow"><b>${t('quiz')}</b><div class="sm mu">${q?`${t('last')} ${q.last}/10 · ${t('best')} ${q.best}/10`:t('quizSub')}</div></div><span class="mu">›</span></div>`}
function startFlash(){if(!curWords(bab(S.bab)).length){toast(t('empty'));return}S.mode='flash';S.fi=0;S.flip=false;render()}
function vFlash(b){return flashView(curWords(b),pkLabel(),"S.mode='menu';render()")}
function flashView(ws,label,exitJs){if(!ws.length)return `<button class="back" onclick="${exitJs}">‹ ${t('back')}</button><div class="card mu">${t('empty')}</div>`;
  if(S.fi>=ws.length)S.fi=ws.length-1;const w=ws[S.fi];

  <div class="qhead"><span>${t('flash')} · ${label}</span><span>${S.fi+1} / ${ws.length}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${(S.fi+1)/ws.length*100}%"></i></div>
  <div class="flash ${S.flip?'flip':''}" onclick="S.flip=!S.flip;this.classList.toggle('flip')">
   <div class="fi"><div class="face">${isNew(w)?`<div class="tag" style="color:var(--ac)">${t('newMark')}</div>`:''}<div class="k">${esc(w.kata)}</div><div class="c">“${esc(w.contoh)}”</div>
    <button class="spk" onclick="event.stopPropagation();speak('${jsq(w.kata+'. '+w.contoh)}',.85,this)">${ic('spk')} ${t('listen')}</button><div class="c sm">${t('tap')}</div></div>
   <div class="face back"><div class="tag">${esc(w.kata)}</div><div class="a">${esc(w.arti)}</div><div class="c">“${esc(w.contoh)}”</div>
    ${w.contoh_arti?`<div class="ca">${esc(w.contoh_arti)}</div>`:''}
    <button class="spk" onclick="event.stopPropagation();speak('${jsq(w.contoh)}',.85,this)">${ic('spk')} ${t('listen')}</button></div></div></div>
  <div class="nav2"><button class="btn ghost" onclick="fNav(-1)" ${S.fi===0?'disabled style="opacity:.4"':''}>${t('prev')}</button>
  <button class="btn" onclick="${S.fi===ws.length-1?exitJs:'fNav(1)'}">${S.fi===ws.length-1?t('done'):t('next')}</button></div>`}
function fNav(d){S.fi+=d;S.flip=false;render()}
function startQuiz(){const b=bab(S.bab),ws=curWords(b);if(ws.length<4){toast(t('needWords'));return}
  stopAudio();const n=Math.min(10,ws.length),pool=shuffle(ws).slice(0,n);let reads=0;const qs=[];
  const ordIdx=shuffle(pool.map((w,i)=>orderOk(w)?i:-1).filter(i=>i>=0)).slice(0,1+Math.floor(Math.random()*2)).sort((a,b)=>a-b);
  pool.forEach((w,i)=>{if(ordIdx.includes(i)){qs.push(makeQ('order',w,ws,{distract:ordIdx.indexOf(i)===1}));return}
    const el=eligibleTypes(w,ws,reads);const type=el[Math.floor(Math.random()*el.length)];if(type==='read')reads++;qs.push(makeQ(type,w,ws))});
  S.quiz={qs,i:0,phase:'main',wrong:[],review:[],ri:0,score:0,fixed:0,done:false,saved:null,final:0};S.mode='quiz';render()}
const orderToks=w=>w.contoh.trim().split(/\s+/).map(x=>{x=x.replace(/^[^\w']+/,'').replace(/[^\w'.]+$/,'');return /^([a-z]\.){2,}$/i.test(x)?x:x.replace(/\.+$/,'')}).filter(Boolean);
const orderOk=w=>!!(w.contoh_arti&&w.contoh_arti.trim())&&orderToks(w).length>=3&&orderToks(w).length<=10;
const SRClass=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
function clozeOf(w){const parts=w.kata.trim().split(/\s+/).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('\\b'+parts.join('\\w*\\s+')+'\\w*','i');return re.test(w.contoh)?w.contoh.replace(re,'_____'):null}
function eligibleTypes(w,ws,reads){const el=['match','en','listen'];
  if(clozeOf(w))el.push('cloze');
  if(w.contoh_arti&&ws.filter(x=>x.id!==w.id&&x.contoh_arti&&x.contoh_arti!==w.contoh_arti).length>=3)el.push('sent');
  if(SRClass()&&reads<2&&w.contoh.trim().split(/\s+/).length>=2)el.push('read');
  return el}
function makeQ(type,w,ws,opt={}){const q={type,w,answered:false,correct:null,picked:null};
  if(type==='order'){const toks=orderToks(w);q.target=toks.map(x=>x.toLowerCase());q.distract=!!opt.distract;
    let tiles=toks.map((x,i)=>({id:i,txt:x}));
    if(q.distract){const have=new Set(q.target);const pool=shuffle(ws.filter(x=>x.id!==w.id).flatMap(x=>orderToks(x))).filter(x=>!have.has(x.toLowerCase()));if(pool.length)tiles.push({id:99,txt:pool[0]})}
    let sh=shuffle(tiles);for(let k=0;k<6&&sh.slice(0,toks.length).every((x,i)=>x.id===i);k++)sh=shuffle(tiles);
    q.tiles=sh;q.ans=[];return q}
  if(type==='match'){const others=shuffle(ws.filter(x=>x.id!==w.id&&x.kata!==w.kata&&x.arti!==w.arti)).slice(0,3);const set=[w,...others];
    q.left=shuffle(set).map(x=>x.id);q.right=shuffle(set).map(x=>x.id);q.words=Object.fromEntries(set.map(x=>[x.id,x]));q.matched=[];q.sel=null;q.errors=0;q.flash=null}
  else if(type==='sent'){const others=shuffle(ws.filter(x=>x.id!==w.id&&x.contoh_arti&&x.contoh_arti!==w.contoh_arti)).slice(0,3);q.opts=shuffle([w,...others])}
  else if(type==='read'){q.rec='idle';q.heard=null;q.marks=null}
  else{const others=shuffle(ws.filter(x=>x.id!==w.id&&x.kata!==w.kata&&x.arti!==w.arti)).slice(0,3);q.opts=shuffle([w,...others])}
  return q}
function curQ(){const Q=S.quiz;return Q.phase==='main'?Q.qs[Q.i]:Q.review[Q.ri]}
function answerQ(ok){const Q=S.quiz,q=curQ();if(q.answered)return;q.answered=true;q.correct=ok;
  if(Q.phase==='main'){if(ok)Q.score++;else Q.wrong.push(q)}else if(ok)Q.fixed++}
function oTap(id){const q=curQ();if(q.answered||q.ans.includes(id))return;q.ans.push(id);render()}
function oBack(id){const q=curQ();if(q.answered)return;q.ans=q.ans.filter(x=>x!==id);render()}
function oCheck(){const q=curQ();if(q.answered||q.ans.length<q.target.length)return;
  const got=q.ans.map(id=>q.tiles.find(x=>x.id===id).txt.toLowerCase()).join(' ');answerQ(got===q.target.join(' '));render()}
function pick(id){const q=curQ();if(q.answered)return;q.picked=id;answerQ(id===q.w.id);render()}
function mLeft(id){const q=curQ();if(q.answered||q.matched.includes(id))return;q.sel=id;q.flash=null;render()}
function mRight(id){const q=curQ();if(q.answered||q.matched.includes(id)||q.sel==null)return;
  if(q.sel===id){q.matched.push(id);q.sel=null;if(q.matched.length===q.left.length)answerQ(q.errors<=1);render()}
  else{q.errors++;q.flash=[q.sel,id];q.sel=null;render();setTimeout(()=>{if(q.flash){q.flash=null;render()}},650)}}
const NUMW={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12'};
function normTok(s){return s.toLowerCase().replace(/\b([ap])\.\s?m\.?/g,'$1m').replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean).map(x=>NUMW[x]||x)}
function scoreRead(target,alts){const tgt=normTok(target);let best=null;
  alts.forEach(a=>{const pool=normTok(a);const marks=tgt.map(tk=>{const k=pool.indexOf(tk);if(k>=0){pool.splice(k,1);return true}return false});
    const r=marks.filter(Boolean).length/tgt.length;if(!best||r>best.r)best={r,marks,heard:a}});
  return best}
function startRec(){const q=curQ(),SR=SRClass();if(!SR||q.answered)return;stopAudio();
  try{const r=new SR();S.rec=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const b=scoreRead(q.w.contoh,alts);q.heard=b.heard;q.marks=b.marks;q.rec='done';answerQ(b.r>=.7);render()};
    r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){q.rec='error'}else{q.rec='idle';toast(t('micNo'))}render()};
    r.onend=()=>{if(q.rec==='listening'){q.rec='idle';toast(t('micNo'));render()}};
    q.rec='listening';render();r.start()}catch(e){q.rec='error';render()}}
function swapRead(){const Q=S.quiz,b=bab(S.bab),ws=curWords(b),q=curQ();const nq=makeQ(clozeOf(q.w)?'cloze':'en',q.w,ws);

function qLabel(type){return{match:t('qMatch'),en:t('q2'),listen:t('q3'),cloze:t('qCloze'),sent:t('qSent'),read:t('qRead'),order:t('qOrder')}[type]}
function vQuiz(b){const Q=S.quiz;
  if(Q.done){const r=Q.saved||S.user.quiz[qKey()]||{best:Q.final,tries:1};
    return `<div class="big"><div class="tag">${t('result')}</div><div class="score">${Q.score}/${Q.qs.length}</div>
    ${Q.review.length?`<p class="fixd">${ic('check',14)} ${Q.fixed}/${Q.review.length} ${t('fixed')}</p>`:''}
    <p class="mu">${t('best')}: ${r.best}/10 · ${t('tries')}: ${r.tries}</p></div>
    <button class="btn" onclick="startQuiz()">${t('again')}</button><div style="height:10px"></div><button class="btn ghost" onclick="stopAudio();S.mode='menu';render()">${t('done')}</button>`}
  const q=curQ(),rev=Q.phase==='review';
  const tot=rev?Q.review.length:Q.qs.length,idx=rev?Q.ri:Q.i;
  let body='';
  if(q.type==='match'){const W=q.words;
    const cell=(id,side)=>{const done=q.matched.includes(id);let cls=done?'ok':'';if(side==='l'&&q.sel===id)cls='sel';if(q.flash&&q.flash[side==='l'?0:1]===id)cls='no';
      return `<button class="mt ${cls}" ${done||q.answered?'disabled':''} onclick="${side==='l'?'mLeft':'mRight'}(${id})">${esc(side==='l'?W[id].kata:W[id].arti)}</button>`};
    body=`<div class="mgrid"><div>${q.left.map(id=>cell(id,'l')).join('')}</div><div>${q.right.map(id=>cell(id,'r')).join('')}</div></div>
    ${q.errors?`<p class="sm mu" style="text-align:center">${t('mistakes')}: ${q.errors}</p>`:''}`}
  else if(q.type==='read'){
    const sent=q.marks?q.w.contoh.split(/\s+/).map((tk,i)=>{const m=q.marks[i];return `<span class="${m===undefined?'':m?'rok':'rno'}">${esc(tk)}</span>`}).join(' '):esc(q.w.contoh);
    body=`<div class="qq rd">${sent}</div>
    <div class="lis" style="margin-bottom:14px"><button class="spk" onclick="speak('${jsq(q.w.contoh)}',.85,this)">${ic('spk',18)} ${t('listen')}</button></div>
    ${q.rec==='error'?`<div class="card" style="text-align:center"><p class="sm mu" style="margin:0 0 10px">${t('micErr')}</p><button class="btn" onclick="swapRead()">${t('swapQ')}</button></div>`:
     q.answered?`<p class="sm mu" style="text-align:center">${t('micHeard')}: “${esc(q.heard||'')}”</p>`:
     `<button class="btn mic ${q.rec==='listening'?'on':''}" onclick="startRec()">${ic('mic',18)} ${q.rec==='listening'?t('micListening'):t('micTap')}</button>`}`}
  else if(q.type==='order'){const T=id=>q.tiles.find(x=>x.id===id);
    body=`<div class="qq qs2">“${esc(q.w.contoh_arti)}”</div>
    <div class="oans ${q.answered?(q.correct?'okb':'nob'):''}">${q.ans.length?q.ans.map(id=>`<button class="tile on" ${q.answered?'disabled':''} onclick="oBack(${id})">${esc(T(id).txt)}</button>`).join(''):`<span class="sm mu">${t('orderHint')}</span>`}</div>
    <div class="opool">${q.tiles.filter(x=>!q.ans.includes(x.id)).map(x=>`<button class="tile" ${q.answered?'disabled':''} onclick="oTap(${x.id})">${esc(x.txt)}</button>`).join('')}</div>
    ${q.answered?(q.correct?'':`<div class="card reveal"><div class="tag">${t('correctSent')}</div><b>${esc(q.w.contoh)}</b> <button class="mini" aria-label="${t('listen')}" onclick="speak('${jsq(q.w.contoh)}',.85,this)">${ic('spk',15)}</button></div>`)
     :`<button class="btn" ${q.ans.length<q.target.length?'disabled style="opacity:.45"':''} onclick="oCheck()">${t('check')}</button>`}`}
  else{const prompt=q.type==='en'?esc(q.w.arti):q.type==='cloze'?esc(clozeOf(q.w)):q.type==='sent'?`“${esc(q.w.contoh)}”`:
      `<div class="lis"><button class="spk big2" onclick="speak('${jsq(q.w.kata)}',.85,this)">${ic('spk',20)} ${t('play')}</button><button class="slow" aria-label="${t('slow')}" title="${t('slow')}" onclick="speak('${jsq(q.w.kata)}',.3,this)">${ic('turtle',24)}</button></div>`;
    const opts=q.opts.map(o=>{const txt=q.type==='sent'?o.contoh_arti:o.kata;let cls='';if(q.answered){if(o.id===q.w.id)cls='ok';else if(o.id===q.picked)cls='no'}
      return `<button class="opt ${cls}" ${q.answered?'disabled':''} onclick="pick(${o.id})">${esc(txt)}</button>`}).join('');
    body=`<div class="qq ${q.type==='cloze'||q.type==='sent'?'qs2':''}">${prompt}</div>${q.type==='cloze'&&q.w.contoh_arti?`<p class="ctr">${esc(q.w.contoh_arti)}</p>`:''}${opts}`}
  const reveal=rev&&q.answered&&!q.correct?`<div class="card reveal"><div class="tag">${t('correctAns')}</div><b>${esc(q.w.kata)}</b> · ${esc(q.w.arti)}
    <div class="sm mu" style="margin-top:4px">“${esc(q.w.contoh)}”</div>${q.w.contoh_arti?`<div class="sm" style="color:var(--ac)">${esc(q.w.contoh_arti)}</div>`:''}
    <button class="mini" style="margin-top:8px" aria-label="${t('listen')}" onclick="speak('${jsq(q.w.kata+'. '+q.w.contoh)}',.85,this)">${ic('spk',15)}</button></div>`:'';
  const fb=q.answered&&!rev?`<p class="fb ${q.correct?'g':'r'}">${q.correct?t('right'):t('wrongAns')}</p>`:'';
  const btnLbl=rev?(Q.ri===Q.review.length-1?t('result'):t('next')):(Q.i===Q.qs.length-1?(Q.wrong.length?t('toReview'):t('result')):t('next'));
  return `<button class="back" onclick="stopAudio();S.mode='menu';render()">‹ ${t('back')}</button>
  ${rev?`<div class="revh">${ic('refresh',14)} ${t('review')} · ${idx+1}/${tot}</div>`:''}
  <div class="qhead"><span>${rev?'':t('question')+' '}${idx+1}/${tot}</span><span>${rev?'':`${ic('check',13)} ${Q.score}`}</span></div><div class="bar"><i style="width:${idx/tot*100}%"></i></div>
  <p class="mu sm" style="text-align:center;margin-top:18px">${qLabel(q.type)}</p>${body}${fb}${reveal}
  ${q.answered?`<button class="btn" style="margin-top:8px" onclick="nextQ()">${btnLbl}</button>`:''}`}
async function nextQ(){const Q=S.quiz;stopAudio();
  if(Q.phase==='main'){if(Q.i<Q.qs.length-1){Q.i++;render();scrollTo(0,0);return}
    Q.final=Math.round(Q.score/Q.qs.length*10);submitQuiz();
    if(Q.wrong.length){const b=bab(S.bab),ws=curWords(b);Q.review=Q.wrong.map(o=>makeQ(o.type==='read'&&!SRClass()?'en':o.type,o.w,ws,{distract:o.distract}));Q.phase='review';Q.ri=0;render();scrollTo(0,0);return}
    Q.done=true;render();return}
  if(Q.ri<Q.review.length-1){Q.ri++;render();scrollTo(0,0);return}
  Q.done=true;render()}
async function submitQuiz(){const Q=S.quiz,key=qKey(),pk=S.paket===0?'all':String(S.paket);
  await run(async()=>{const{data,error}=await sb.rpc('submit_quiz',{p_bab:S.bab,p_paket:pk,p_score:Q.final});if(error)throw error;
    const r=Array.isArray(data)?data[0]:data;Q.saved={last:r.last,best:r.best,tries:r.tries};S.user.quiz[key]=Q.saved},false);
  if(Q.done)render()}

function vScore(s,b,edit){const maxOpen=maxOpenOf(s,b);
  if(!maxOpen)return `<div class="card mu">${t('locked')}</div>`;
  const all=b.words.slice(0,maxOpen*20),h=all.filter(w=>st(s,w)==='hafal').length,be=all.filter(w=>st(s,w)==='belum').length;
  let html=`${edit?'':`<h1>${t('score')}</h1>`}<div class="stats"><div class="stat"><b style="color:var(--ok)">${h}</b><span>${t('hafal')}</span></div>
  <div class="stat"><b style="color:var(--warn)">${be}</b><span>${t('belum')}</span></div><div class="stat"><b>${all.length-h-be}</b><span>${t('baru')}</span></div></div>
  ${edit?'':`<p class="sm mu" style="margin:0 0 6px">${t('tapHint')} · ${t('viewOnly')}</p>`}`;
  const qa=s.quiz[b.id+'-all'];if(qa)html+=`<p class="sm mu" style="margin:0 0 6px">${t('quiz')} ${t('allWords')}: ${qa.last}/10 (${t('best')} ${qa.best}, ${qa.tries}x)</p>`;
  for(let p=1;p<=maxOpen;p++){const ws=pkWords(b,p);if(!ws.length)continue;const ph=ws.filter(w=>st(s,w)==='hafal').length,q=s.quiz[b.id+'-'+p];
    const key=`${s.id}-${b.id}-${p}`,open=S.open[key]??(p===maxOpen),full=ph===ws.length;
    html+=`${p>1?'<div class="pksep"></div>':''}<button class="pkh ${open?'op':''}" onclick="togPk('${key}',${p===maxOpen})"><span class="chev">›</span><span class="pkt">${t('paket')} ${p}</span>
      <span class="pks ${full?'full':''}">${ph}/${ws.length}${full?' '+ic('check',12):''} · ${q?`${t('quiz')} ${q.last}/10`:t('noQuiz')}</span></button>`;
    if(!open)continue;
    html+=`${q?`<p class="sm mu" style="margin:0 0 6px">${t('best')} ${q.best}/10 · ${q.tries}x</p>`:''}<div class="wl">`;
    ws.forEach((w,i)=>{const v=st(s,w);
      html+=`<div class="wi ${v}"><span class="no">${(p-1)*20+i+1}</span>${edit?`<div class="grow"><b>${esc(w.kata)}</b> <span class="sm mu">· ${esc(w.arti)}</span><div class="sm mu ex">“${esc(w.contoh)}”</div>${w.contoh_arti?`<div class="sm" style="color:var(--ac)">${esc(w.contoh_arti)}</div>`:''}</div>
      <select onchange="setSt('${s.id}',${w.id},this.value,this)">${['baru','belum','hafal'].map(o=>`<option value="${o}" ${o===v?'selected':''}>${t(o)}</option>`).join('')}</select>`:
      `<div class="grow wcard" onclick="this.classList.toggle('open')"><b>${esc(w.kata)}</b> <span class="sm hid">· ${t('tapShort')}</span><span class="sm ar">· ${esc(w.arti)}</span><div class="sm mu ex">“${esc(w.contoh)}”</div>${w.contoh_arti?`<div class="sm ar2">${esc(w.contoh_arti)}</div>`:''}</div>
      <button class="mini" aria-label="${t('listen')}" onclick="speak('${jsq(w.kata+'. '+w.contoh)}',.85,this)">${ic('spk',15)}</button><span class="st ${v}">${t(v)}</span>`}</div>`});
    html+='</div>'}
  return html}

  <h2>${t('pasteTitle')}</h2><div class="card"><p class="sm mu" style="margin:0 0 8px">${t('pasteHint')}</p>
  <button class="btn ghost sm2" style="margin-bottom:10px" onclick="copyPrompt()">${t('copyPrompt')}</button>
  <textarea id="pb" placeholder="sweep | menyapu | I sweep the floor. | Aku menyapu lantai."></textarea><div style="height:10px"></div>
  <button class="btn" type="button" onclick="pasteWords()">${t('save')}</button></div>
  <h2>${t('wordList')} <span class="sm mu" style="font-weight:400">· ${t('autoSplit')}</span></h2><p class="sm mu" style="margin:-4px 0 8px">${t('tapEdit')}</p>
  ${b.words.length?`<div class="card bab" onclick="openMFlash(0)"><div class="n">${ic('cards',18)}</div><div class="grow"><b>${t('flash')} · ${t('allWords')}</b><div class="sm mu">${b.words.length} ${t('words')}</div></div><span class="mu">›</span></div>`:''}
  ${b.words.length?`<div class="msearch">${ic('search',16)}<input id="mq" type="search" placeholder="${t('searchWord')}" value="${esc(S.mq||'')}" oninput="S.mq=this.value;$('mlist').innerHTML=matList(bab(S.mBab))"></div><div id="mlist">${matList(b)}</div>`:`<div class="card mu">${t('empty')}</div>`}`:''}`}
function mRow(w,idx){return S.editWord===w.id?`<div class="wi" style="display:block" ${enter('saveWord')}>
      <div class="field"><label>${t('word')}</label><input id="ek" value="${esc(w.kata)}"></div>
      <div class="field"><label>${t('meaning')}</label><input id="ea" value="${esc(w.arti)}"></div>
      <div class="field"><label>${t('example')} *</label><input id="ec" value="${esc(w.contoh)}"></div>
      <div class="field"><label>${t('sentMeaning')}</label><input id="eca" value="${esc(w.contoh_arti)}"></div>
      <div style="display:flex;gap:8px"><button class="btn sm2" type="button" onclick="saveWord()">${t('save')}</button><button class="btn ghost sm2" type="button" onclick="S.editWord=null;S.confirm=null;render()">${t('cancel')}</button>
      <span class="grow"></span><button class="btn ghost sm2" style="color:var(--bad)" type="button" onclick="delWord()">${S.confirm==='w'+w.id?t('sureDel'):t('del')}</button></div></div>`:
    `<div class="wi" style="cursor:pointer" onclick="S.editWord=${w.id};S.confirm=null;render()"><span class="no">${idx+1}</span><div class="grow"><b>${esc(w.kata)}</b> <span class="sm mu">· ${esc(w.arti)}</span>${isNew(w)?`<span class="pill">${t('newMark')}</span>`:''}<div class="sm mu">“${esc(w.contoh)}”</div>${w.contoh_arti?`<div class="sm" style="color:var(--ac)">${esc(w.contoh_arti)}</div>`:''}</div><span class="mu sm">${t('edit')}</span></div>`}
function matList(b){const q=(S.mq||'').trim().toLowerCase();
  if(q){const hits=b.words.map((w,i)=>[w,i]).filter(([w])=>(w.kata+' '+w.arti+' '+w.contoh+' '+(w.contoh_arti||'')).toLowerCase().includes(q));
    return hits.length?`<p class="sm mu" style="margin:4px 0 8px">${hits.length} ${t('found')}</p><div class="wl">${hits.map(([w,i])=>mRow(w,i)).join('')}</div>`:`<div class="card mu">${t('notFound')}</div>`}
  const n=pakets(b);return Array.from({length:n},(_,i)=>{const p=i+1,ws=pkWords(b,p),key=`m-${b.id}-${p}`,hasEdit=ws.some(w=>w.id===S.editWord),open=hasEdit||(S.open[key]??(p===n));
    return `${i?'<div class="pksep"></div>':''}<div class="pkrow"><button class="pkh ${open?'op':''}" onclick="togPk('${key}',${p===n})"><span class="chev">›</span><span class="pkt">${t('paket')} ${p}</span><span class="pks">${ws.length}/20</span></button>
    <button class="flbtn" onclick="openMFlash(${p})">${ic('cards',12)} ${t('flash')}</button></div>${open?`<div class="wl">${ws.map((w,j)=>mRow(w,i*20+j)).join('')}</div>`:''}`}).join('')}
async function addBab(){const n=$('bn').value.trim();if(!n){toast(t('fill'));return}
  const ok=await run(async()=>{const{data,error}=await sb.from('babs').insert({nama:n.slice(0,80)}).select('id,nama').single();if(error)throw error;DB.babs.push({...data,words:[]});S.mBab=data.id});
  if(ok)toast(t('babCreated'));render()}
async function addWord(){const k=$('wk').value.trim(),a=$('wa').value.trim(),c=$('wc').value.trim(),ca=$('wca').value.trim();if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const ok=await run(async()=>{const{data,error}=await sb.from('words').insert({bab_id:S.mBab,kata:k,arti:a,contoh:c,contoh_arti:ca.slice(0,400)}).select('id,bab_id,kata,arti,contoh,contoh_arti,created_at').single();if(error)throw error;bab(S.mBab).words.push(data)});
  if(ok)toast('1 '+t('wordsAdded'));render()}
function parse(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^\|?\s*:?-{2,}/.test(l)).map(l=>{l=l.replace(/^\|/,'').replace(/\|$/,'');
  let p=(l.includes('\t')?l.split('\t'):l.split('|')).map(x=>x.trim().replace(/^\*\*|\*\*$/g,''));if(/^\d+\.?$/.test(p[0])&&p.length>=4)p.shift();return p}).filter(p=>p.length>=2&&p[0]&&!/^(kata|word|no)$/i.test(p[0]))}
async function pasteWords(){const rows=parse($('pb').value);if(!rows.length){toast(t('nothing'));return}
  const ok=rows.filter(p=>(p[2]||'').trim()&&p[1]),skip=rows.length-ok.length;
  if(!ok.length){toast(`${skip} ${t('skipped')}`,3500);return}
  const payload=ok.map(p=>({bab_id:S.mBab,kata:p[0].slice(0,120),arti:p[1].slice(0,200),contoh:p[2].slice(0,400),contoh_arti:p.slice(3).join(' | ').trim().slice(0,400)}));
  const done=await run(async()=>{const{data,error}=await sb.from('words').insert(payload).select('id,bab_id,kata,arti,contoh,contoh_arti,created_at');if(error)throw error;
    data.sort((x,y)=>x.id-y.id).forEach(w=>bab(S.mBab).words.push(w))});
  if(done)toast(ok.length+' '+t('wordsAdded')+(skip?` · ${skip} ${t('skipped')}`:''),3500);render()}
async function saveWord(){const k=$('ek').value.trim(),a=$('ea').value.trim(),c=$('ec').value.trim(),ca=$('eca').value.trim().slice(0,400);if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const id=S.editWord;const ok=await run(async()=>{const{error}=await sb.from('words').update({kata:k,arti:a,contoh:c,contoh_arti:ca}).eq('id',id);if(error)throw error;
    const w=bab(S.mBab).words.find(x=>x.id===id);Object.assign(w,{kata:k,arti:a,contoh:c,contoh_arti:ca})});
  if(ok){S.editWord=null;toast(t('wordSaved'))}render()}
async function delWord(){const id=S.editWord;if(S.confirm!=='w'+id){S.confirm='w'+id;render();return}
  S.confirm=null;const ok=await run(async()=>{const{error}=await sb.from('words').delete().eq('id',id);if(error)throw error;const b=bab(S.mBab);b.words=b.words.filter(x=>x.id!==id)});
  if(ok){S.editWord=null;toast(t('wordDeleted'))}render()}
function copyPrompt(){const txt='Buatkan 20 vocabulary bahasa Inggris tentang [TOPIK] untuk pemula. Tampilkan dalam bentuk tabel 4 kolom TANPA header: Kata Inggris | Arti Indonesia | Contoh kalimat sangat sederhana | Arti contoh kalimat dalam bahasa Indonesia.';
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(txt,6000))}catch(e){toast(txt,6000)}}

/* ---------- boot ---------- */
function readRole(){try{return location.hash==='#guru'?'teacher':'student'}catch(e){return 'student'}}
window.addEventListener('hashchange',()=>{S.loginTab=readRole();S.err='';if(!S.user)boot()});
async function boot(){S.loginTab=readRole();
  try{
    if(S.loginTab==='teacher'){const{data}=await sb.rpc('teacher_exists');S.needSetup=data===false}
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enterApp(session);render();return}
  }catch(e){console.error(e);await doSignOut()}
  S.view='login';S.anim=true;render()}
render();boot();

</script>
