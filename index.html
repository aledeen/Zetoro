<style>
:root{--bg:#141210;--card:#1E1B18;--card2:#25211D;--line:#2E2A26;--tx:#F1EDE8;--mu:#9A928A;--ac:#D08A5B;--acs:#3A2A1F;--on:#24130A;

[data-theme=light]{--bg:#F7F5F2;--card:#FFFFFF;--card2:#F1EDE8;--line:#E7E2DC;--tx:#1C1915;--mu:#6B635B;--ac:#A65A2E;--acs:#F6E8DE;--on:#FFFFFF;
--ok:#2F7A5F;--oks:#E4F2EC;--warn:#94700F;--warns:#FBF1D9;--bad:#B4472F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:12px 16px}
.logo{font-weight:600;letter-spacing:3px;font-size:14px;flex:1}.logo span{color:var(--ac)}
.ib{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.ib:hover{border-color:var(--ac)}
main{flex:1;padding:18px 16px 90px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}h2{font-size:15px;font-weight:600;margin:22px 0 10px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{display:block;width:100%;background:var(--ac);color:var(--on);border:none;border-radius:8px;padding:12px;font-weight:600;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm2{display:inline-block;width:auto;padding:7px 12px;font-size:13px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;letter-spacing:.3px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.seg button{flex:1;background:none;border:none;padding:8px;border-radius:6px;cursor:pointer;color:var(--mu);font-weight:500}
.seg button.on{background:var(--acs);color:var(--ac)}
.pw{position:relative}.pw input{padding-right:46px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mu);cursor:pointer;padding:6px;display:flex}.eye:hover{color:var(--ac)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.demo button{background:var(--acs);color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;flex-shrink:0}
.wcard{cursor:pointer}.wcard .ar{display:none;color:var(--ac);font-weight:500}.wcard .hid{color:var(--mu);font-style:italic}.wcard.open .ar{display:inline}.wcard.open .hid{display:none}.ex{margin-top:2px}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;cursor:pointer;flex-shrink:0;font-size:13px}
.err{color:var(--bad);font-size:13px;margin:-4px 0 10px}
.hint{font-size:12px;color:var(--mu);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:16px}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .t1{font-size:12px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase}
.lvl .t2{font-weight:600;font-size:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--ac);border-radius:3px}
.row{display:flex;align-items:center;gap:12px}
.bab{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px}
.bab:hover{border-color:var(--ac)}
.bab.lock{opacity:.5;cursor:default}
.bab .n{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ac);flex-shrink:0}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--ac);color:var(--ac);background:var(--acs)}
.chip.lock{opacity:.45;cursor:default}
.flash{perspective:1000px;height:260px;margin:6px 0 14px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);border-color:var(--ac)}
.face .k{font-size:30px;font-weight:600}
.face .a{font-size:22px;font-weight:600;color:var(--ac)}
.face .c{margin-top:12px;color:var(--mu);font-size:14px}
.tag{font-size:11px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:10px}
.spk{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
.nav2{display:flex;gap:10px}.nav2 .btn{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px;margin-bottom:9px;cursor:pointer}
.opt:hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--oks);color:var(--ok)}
.opt.no{border-color:var(--bad);color:var(--bad)}
.qhead{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}
.qq{font-size:22px;font-weight:600;margin:10px 0 18px;text-align:center}
.wl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.wi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.wi:last-child{border-bottom:none}
.wi .no{width:22px;font-size:12px;color:var(--mu)}
.wi b{font-weight:600}
.st{font-size:11.5px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}
.st.hafal{color:var(--ok);border-color:var(--ok);background:var(--oks)}
.st.belum{color:var(--warn);border-color:var(--warn);background:var(--warns)}
.wi.hafal{background:var(--oks)}.wi.belum{background:var(--warns)}
.pk{font-size:12px;letter-spacing:1px;color:var(--ac);text-transform:uppercase;margin:16px 0 6px;display:flex;justify-content:space-between}
.pksep{border-top:3px solid var(--tx);margin:14px 0 0}
.wi select{width:auto;padding:5px 8px;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--mu)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.bnav>div{max-width:480px;width:100%;display:flex}
.bnav button{flex:1;background:none;border:none;padding:10px 4px 14px;color:var(--mu);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav button.on{color:var(--ac)}
.bnav svg{width:20px;height:20px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;padding:0;margin-bottom:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.big{text-align:center;padding:24px 10px}
.big .score{font-size:44px;font-weight:600;color:var(--ac)}
.pill{display:inline-block;font-size:11px;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:1px 7px;margin-left:6px}
.proto{font-size:11px;text-align:center;color:var(--mu);padding:6px;border-bottom:1px solid var(--line);background:var(--card)}
</style>
</head>

/* ---------- data loading ---------- */
async function loadData(){
  const uid=S.user.id;
  const [babs,words]=await Promise.all([fetchAll('babs','id,nama'),fetchAll('words','id,bab_id,kata,arti,contoh,created_at')]);
  DB.babs=babs.map(b=>({...b,words:words.filter(w=>w.bab_id===b.id)}));
  const [unl,sts,qz]=await Promise.all([fetchAll('unlocks','student_id,bab_id,paket','bab_id'),fetchAll('statuses','student_id,word_id,status','word_id'),fetchAll('quiz_results','student_id,bab_id,paket,last,best,tries','bab_id')]);
  let studs;
  if(S.role==='teacher'){const{data,error}=await sb.from('profiles').select('id,nama,username,created_at').eq('role','student').order('created_at');if(error)throw error;studs=data}
  else studs=[{id:uid,nama:S.user.nama,username:S.user.username}];
  DB.students=studs.map(p=>({...p,unlocked:{},status:{},quiz:{}}));
  const byId=Object.fromEntries(DB.students.map(s=>[s.id,s]));
  unl.forEach(u=>{if(byId[u.student_id])byId[u.student_id].unlocked[u.bab_id]=u.paket});
  sts.forEach(x=>{if(byId[x.student_id])byId[x.student_id].status[x.word_id]=x.status});
  qz.forEach(q=>{if(byId[q.student_id])byId[q.student_id].quiz[q.bab_id+'-'+q.paket]={last:q.last,best:q.best,tries:q.tries}});
  if(S.role==='student')S.user=byId[uid];
  if(!S.mBab&&DB.babs[0])S.mBab=DB.babs[0].id;
}
async function enterApp(session){
  const{data:prof,error}=await sb.from('profiles').select('id,role,nama,username').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!prof){await sb.auth.signOut();throw new Error(t('notStudent'))}
  S.role=prof.role;S.user=prof;
  await loadData();
  if(S.role==='teacher'){S.view='admin';S.aTab='sum';S.gStudent=DB.students[0]?.id||null}else S.view='home';
}

/* ---------- learn ---------- */
function maxOpenOf(s,b){return Math.min(s.unlocked[b.id]||0,pakets(b))}
function curWords(b){return S.paket===0?b.words.slice(0,maxOpenOf(S.user,b)*20):pkWords(b,S.paket)}
function qKey(){return S.bab+'-'+(S.paket===0?'all':S.paket)}
function pkLabel(){return S.paket===0?t('allWords'):t('paket')+' '+S.paket}
function pkChips(b,maxOpen){let h=`<button class="chip ${S.paket===0?'on':''}" onclick="selPk(0)">${t('allWords')}</button>`;
  for(let p=1;p<=pakets(b);p++){const lk=p>maxOpen;h+=`<button class="chip ${p===S.paket?'on':''} ${lk?'lock':''}" ${lk?'':`onclick="selPk(${p})"`}>${lk?'🔒 ':''}${t('paket')} ${p}</button>`}
  return `<div class="chips">${h}</div>`}
function selPk(p){S.paket=p;S.mode='menu';S.fi=0;S.flip=false;render()}
function vBab(){const b=bab(S.bab),s=S.user;if(!b){S.view='home';return vHome()}const maxOpen=maxOpenOf(s,b);
  const head=`<div class="tag">${esc(b.nama)}</div>`;
  if(S.tab==='score')return head+vScore(s,b,false);
  if(S.mode==='flash')return head+vFlash(b);
  if(S.mode==='quiz')return head+vQuiz(b);
  const ws=curWords(b),h=ws.filter(w=>st(s,w)==='hafal').length,q=s.quiz[qKey()],pct=ws.length?h/ws.length*100:0;
  return head+`<h1>${t('learn')}</h1><p class="mu sm" style="margin:0 0 14px">${pkLabel()} · ${ws.length} ${t('words')}</p>${pkChips(b,maxOpen)}
  <div class="card" style="margin-bottom:12px"><div class="row"><div class="grow"><b>${t('progress')}</b><div class="sm mu">${h}/${ws.length} ${t('mastered')}</div></div><b style="color:var(--ac)">${Math.round(pct)}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="card bab" onclick="startFlash()"><div class="n">${icon.book.replace('<svg','<svg width="18" height="18"')}</div><div class="grow"><b>${t('flash')}</b><div class="sm mu">${t('flashSub')}</div></div><span class="mu">›</span></div>
  <div class="card bab" onclick="startQuiz()"><div class="n">${icon.check.replace('<svg','<svg width="18" height="18"')}</div><div class="grow"><b>${t('quiz')}</b><div class="sm mu">${q?`${t('last')} ${q.last}/10 · ${t('best')} ${q.best}/10`:t('quizSub')}</div></div><span class="mu">›</span></div>`}
function startFlash(){if(!curWords(bab(S.bab)).length){toast(t('empty'));return}S.mode='flash';S.fi=0;S.flip=false;render()}
function vFlash(b){const ws=curWords(b),w=ws[S.fi];
  return `<button class="back" onclick="S.mode='menu';render()">‹ ${t('back')}</button>
  <div class="qhead"><span>${t('flash')} · ${pkLabel()}</span><span>${S.fi+1} / ${ws.length}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${(S.fi+1)/ws.length*100}%"></i></div>
  <div class="flash ${S.flip?'flip':''}" onclick="S.flip=!S.flip;this.classList.toggle('flip')">
   <div class="fi"><div class="face">${isNew(w)?`<div class="tag" style="color:var(--ac)">${t('newMark')}</div>`:''}<div class="k">${esc(w.kata)}</div><div class="c">“${esc(w.contoh)}”</div>
    <button class="spk" onclick="event.stopPropagation();speak('${jsq(w.kata+'. '+w.contoh)}')">🔊 ${t('listen')}</button><div class="c sm">${t('tap')}</div></div>
   <div class="face back"><div class="tag">${esc(w.kata)}</div><div class="a">${esc(w.arti)}</div><div class="c">“${esc(w.contoh)}”</div>
    <button class="spk" onclick="event.stopPropagation();speak('${jsq(w.contoh)}')">🔊 ${t('listen')}</button></div></div></div>
  <div class="nav2"><button class="btn ghost" onclick="fNav(-1)" ${S.fi===0?'disabled style="opacity:.4"':''}>${t('prev')}</button>
  <button class="btn" onclick="${S.fi===ws.length-1?"S.mode='menu';render()":'fNav(1)'}">${S.fi===ws.length-1?t('done'):t('next')}</button></div>`}
function fNav(d){S.fi+=d;S.flip=false;render()}
function startQuiz(){const b=bab(S.bab),ws=curWords(b);if(ws.length<4){toast(t('needWords'));return}
  const pool=shuffle(ws).slice(0,Math.min(10,ws.length));
  const qs=pool.map(w=>{const type=1+Math.floor(Math.random()*3);const others=shuffle(ws.filter(x=>x.id!==w.id&&x.kata!==w.kata&&x.arti!==w.arti)).slice(0,3);return{w,type,opts:shuffle([w,...others])}});
  S.quiz={qs,i:0,score:0,picked:null,done:false,played:false,saved:null};S.mode='quiz';render()}
function vQuiz(b){const Q=S.quiz;
  if(Q.done){const r=Q.saved||S.user.quiz[qKey()]||{best:Q.final,tries:1};
    return `<div class="big"><div class="tag">${t('result')}</div><div class="score">${Q.score}/${Q.qs.length}</div>
    <p class="mu">${t('best')}: ${r.best}/10 · ${t('tries')}: ${r.tries}</p></div>
    <button class="btn" onclick="startQuiz()">${t('again')}</button><div style="height:10px"></div><button class="btn ghost" onclick="S.mode='menu';render()">${t('done')}</button>`}
  const q=Q.qs[Q.i];const label={1:t('q1'),2:t('q2'),3:t('q3')}[q.type];
  const prompt=q.type===1?esc(q.w.kata):q.type===2?esc(q.w.arti):`<button class="spk" style="font-size:16px;padding:12px 22px" onclick="speak('${jsq(q.w.kata)}')">🔊 ${t('play')}</button>`;
  const opts=q.opts.map(o=>{const txt=q.type===1?o.arti:o.kata;let cls='';if(Q.picked){if(o.id===q.w.id)cls='ok';else if(o.id===Q.picked)cls='no'}
    return `<button class="opt ${cls}" ${Q.picked?'disabled':''} onclick="pick(${o.id})">${esc(txt)}</button>`}).join('');
  return `<button class="back" onclick="S.mode='menu';render()">‹ ${t('back')}</button>
  <div class="qhead"><span>${t('question')} ${Q.i+1}/${Q.qs.length}</span><span>✓ ${Q.score}</span></div><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <p class="mu sm" style="text-align:center;margin-top:18px">${label}</p><div class="qq">${prompt}</div>${opts}
  ${Q.picked?`<button class="btn" style="margin-top:6px" onclick="nextQ()">${Q.i===Q.qs.length-1?t('result'):t('next')}</button>`:''}`}
function pick(id){const Q=S.quiz;if(Q.picked)return;Q.picked=id;if(id===Q.qs[Q.i].w.id)Q.score++;render()}
async function nextQ(){const Q=S.quiz;if(Q.i<Q.qs.length-1){Q.i++;Q.picked=null;Q.played=false;render();return}
  Q.done=true;Q.final=Math.round(Q.score/Q.qs.length*10);const key=qKey(),pk=S.paket===0?'all':String(S.paket);render();
  await run(async()=>{const{data,error}=await sb.rpc('submit_quiz',{p_bab:S.bab,p_paket:pk,p_score:Q.final});if(error)throw error;
    const r=Array.isArray(data)?data[0]:data;Q.saved={last:r.last,best:r.best,tries:r.tries};S.user.quiz[key]=Q.saved},false);
  render()}

/* ---------- score (shared) ---------- */
function vScore(s,b,edit){const maxOpen=maxOpenOf(s,b);
  if(!maxOpen)return `<div class="card mu">${t('locked')}</div>`;
  const all=b.words.slice(0,maxOpen*20),h=all.filter(w=>st(s,w)==='hafal').length,be=all.filter(w=>st(s,w)==='belum').length;
  let html=`${edit?'':`<h1>${t('score')}</h1>`}<div class="stats"><div class="stat"><b style="color:var(--ok)">${h}</b><span>${t('hafal')}</span></div>
  <div class="stat"><b style="color:var(--warn)">${be}</b><span>${t('belum')}</span></div><div class="stat"><b>${all.length-h-be}</b><span>${t('baru')}</span></div></div>
  ${edit?'':`<p class="sm mu" style="margin:0 0 6px">${t('tapHint')} · ${t('viewOnly')}</p>`}`;
  const qa=s.quiz[b.id+'-all'];if(qa)html+=`<p class="sm mu" style="margin:0 0 6px">${t('quiz')} ${t('allWords')}: ${qa.last}/10 (${t('best')} ${qa.best}, ${qa.tries}x)</p>`;
  for(let p=1;p<=maxOpen;p++){const ws=pkWords(b,p);if(!ws.length)continue;const ph=ws.filter(w=>st(s,w)==='hafal').length,q=s.quiz[b.id+'-'+p];
    html+=`${p>1?'<div class="pksep"></div>':''}<div class="pk"><span>${t('paket')} ${p}</span><span>${ph}/${ws.length} · ${q?`${t('quiz')} ${q.last}/10 (${t('best')} ${q.best}, ${q.tries}x)`:t('noQuiz')}</span></div><div class="wl">`;
    ws.forEach((w,i)=>{const v=st(s,w);
      html+=`<div class="wi ${v}"><span class="no">${(p-1)*20+i+1}</span>${edit?`<div class="grow"><b>${esc(w.kata)}</b> <span class="sm mu">· ${esc(w.arti)}</span><div class="sm mu ex">“${esc(w.contoh)}”</div></div>
      <select onchange="setSt('${s.id}',${w.id},this.value,this)">${['baru','belum','hafal'].map(o=>`<option value="${o}" ${o===v?'selected':''}>${t(o)}</option>`).join('')}</select>`:
      `<div class="grow wcard" onclick="this.classList.toggle('open')"><b>${esc(w.kata)}</b> <span class="sm hid">· ${t('tapShort')}</span><span class="sm ar">· ${esc(w.arti)}</span><div class="sm mu ex">“${esc(w.contoh)}”</div></div>
      <button class="mini" aria-label="${t('listen')}" onclick="speak('${jsq(w.kata+'. '+w.contoh)}')">🔊</button><span class="st ${v}">${t(v)}</span>`}</div>`});
    html+='</div>'}
  return html}
async function setSt(sid,wid,v,el){const s=DB.students.find(x=>x.id===sid),prev=s.status[wid]||'baru';s.status[wid]=v;
  const row=el&&el.closest('.wi');if(row){row.classList.remove('baru','belum','hafal');row.classList.add(v)}
  const ok=await run(async()=>{const{error}=await sb.from('statuses').upsert({student_id:sid,word_id:wid,status:v,updated_at:new Date().toISOString()});if(error)throw error},false);
  if(!ok){s.status[wid]=prev}render()}

function vAdmin(){return {sum:aSum,grade:aGrade,stu:aStu,mat:aMat}[S.aTab]()}
function aSum(){return `<div class="mu sm">${t('teacherHi')}</div><h1>${t('summary')}</h1><div style="height:12px"></div>
  ${DB.students.length?DB.students.map(s=>{const n=hafalCount(s),L=lvlOf(n),ids=Object.keys(s.unlocked).map(Number).sort((a,b)=>a-b),
   act=ids.map(bid=>bab(bid)?`${esc(bab(bid).nama)} · ${t('paket')} ${s.unlocked[bid]}`:'').filter(Boolean).join(', ')||'—';
   return `<div class="card bab" onclick="openGrade('${s.id}',${ids.length?ids[ids.length-1]:(DB.babs[0]?.id||0)})">${ring(L.pct,L.i,48)}<div class="grow"><b>${esc(s.nama)}</b> <span class="sm mu">@${esc(s.username)}</span>
   <div class="sm mu">${t('activePkg')}: ${act}</div><div class="sm mu">${n} ${t('total')}</div></div><span class="mu">›</span></div>`}).join(''):`<div class="card mu">${t('noStudents')}</div>`}`}
function openGrade(sid,bid){S.gStudent=sid;S.gBab=bid;S.aTab='grade';render()}
function aGrade(){const s=DB.students.find(x=>x.id===S.gStudent);const b=bab(S.gBab)||DB.babs[0];
  if(!s||!b)return `<button class="back" onclick="aTab('sum')">‹ ${t('summary')}</button><div class="card mu">${t('noStudents')}</div>`;
  const maxOpen=s.unlocked[b.id]||0,canNext=maxOpen&&b.words.length>maxOpen*20;
  const nb=DB.babs[DB.babs.indexOf(b)+1];
  return `<button class="back" onclick="aTab('sum')">‹ ${t('summary')}</button><h1>${t('gradeOf')}</h1><div style="display:flex;gap:8px;margin:12px 0">
  <select onchange="S.gStudent=this.value;render()">${DB.students.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>
  <select onchange="S.gBab=+this.value;render()">${DB.babs.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.nama)}${s.unlocked[x.id]?'':' 🔒'}</option>`).join('')}</select></div>
  ${maxOpen?vScore(s,b,true):`<div class="card mu" style="margin-bottom:12px">${t('locked')}</div>`}
  <div style="height:14px"></div>
  ${maxOpen?`<button class="btn" onclick="unlockPk('${s.id}',${b.id})" ${canNext?'':'style="opacity:.5"'}>${t('openNext')} (${t('paket')} ${maxOpen+1})</button>`:
   `<button class="btn" onclick="unlockBab('${s.id}',${b.id})">${t('openBab')}: ${esc(b.nama)}</button>`}
  ${maxOpen&&nb&&!s.unlocked[nb.id]?`<div style="height:10px"></div><button class="btn ghost" onclick="unlockBab('${s.id}',${nb.id})">${t('openBab')}: ${esc(nb.nama)}</button>`:''}`}
async function unlockPk(sid,bid){const s=DB.students.find(x=>x.id===sid),b=bab(bid),m=s.unlocked[bid];
  if(!(b.words.length>m*20)){toast(t('noMorePkg'),3000);return}
  const ok=await run(async()=>{const{error}=await sb.from('unlocks').upsert({student_id:sid,bab_id:bid,paket:m+1});if(error)throw error});
  if(ok){s.unlocked[bid]=m+1;toast(`${t('paket')} ${m+1} — ${t('opened')} ${s.nama}`)}render()}
async function unlockBab(sid,bid){const s=DB.students.find(x=>x.id===sid),b=bab(bid);if(!b.words.length){toast(t('empty'));return}
  const ok=await run(async()=>{const{error}=await sb.from('unlocks').upsert({student_id:sid,bab_id:bid,paket:1});if(error)throw error});
  if(ok){s.unlocked[bid]=1;S.gBab=bid;toast(`${b.nama} — ${t('opened')} ${s.nama}`)}render()}

function aStu(){return `<h1>${t('students')}</h1><div style="height:12px"></div>
  ${S.pinShow?`<div class="card" style="border-color:var(--ac);margin-bottom:12px"><div class="sm mu">${t('newPinFor')} ${esc(S.pinShow.nama)} (@${esc(S.pinShow.username)})</div>
   <div style="font-size:32px;font-weight:600;letter-spacing:6px;color:var(--ac);margin:6px 0">${esc(S.pinShow.pin)}</div><p class="sm mu" style="margin:0 0 10px">${t('tellStudent')}</p>
   <button class="btn ghost sm2" onclick="S.pinShow=null;render()">${t('close')}</button></div>`:''}
  ${DB.students.length?DB.students.map(s=>`<div class="card" style="margin-bottom:10px"><div class="row"><div class="grow"><b>${esc(s.nama)}</b><div class="sm mu">@${esc(s.username)}</div></div>
   <button class="btn ghost sm2" onclick="resetPin('${s.id}')">${t('resetPin')}</button>
   <button class="btn ghost sm2" style="color:var(--bad)" onclick="delStudent('${s.id}')">${S.confirm==='s'+s.id?t('sureDel'):t('del')}</button></div></div>`).join(''):`<div class="card mu">${t('noStudents')}</div>`}
  <h2>${t('addStudent')}</h2><div class="card" ${enter('addStu')}>
  <div class="field"><label>${t('name')}</label><input id="sn" placeholder="Budi"></div>
  <div class="field"><label>${t('username')} <span class="mu">(${t('userHint')})</span></label><input id="su" autocapitalize="off" placeholder="budi"></div>
  <div class="field"><label>${t('pin')} <span class="mu">(${t('pinHint')})</span></label><input id="sp" inputmode="numeric" maxlength="6" placeholder="1234"></div>
  ${S.err?`<div class="err">${esc(S.err)}</div>`:''}<button class="btn" type="button" onclick="addStu()">${t('save')}</button></div>`}
async function addStu(){const n=$('sn').value.trim(),u=$('su').value.trim().toLowerCase(),p=$('sp').value.trim();
  if(!n||!u||!p){S.err=t('fill');return render()}
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){S.err='Username 3–20 karakter: huruf kecil, angka, titik, atau garis bawah.';return render()}
  if(!/^\d{4,6}$/.test(p)){S.err='PIN harus 4–6 angka.';return render()}
  S.err='';const ok=await run(async()=>{await invokeAdmin({action:'create_student',nama:n,username:u,pin:p});await loadData()});
  if(ok)toast(t('added'));render()}
async function resetPin(id){const s=DB.students.find(x=>x.id===id),pin=String(Math.floor(1000+Math.random()*9000));
  const ok=await run(async()=>{await invokeAdmin({action:'reset_pin',student_id:id,pin})});
  if(ok){S.pinShow={nama:s.nama,username:s.username,pin};toast(t('pinReset'))}render()}
async function delStudent(id){if(S.confirm!=='s'+id){S.confirm='s'+id;render();return}
  S.confirm=null;const ok=await run(async()=>{await invokeAdmin({action:'delete_student',student_id:id})});
  if(ok){DB.students=DB.students.filter(x=>x.id!==id);toast(t('studentDeleted'))}render()}

function aMat(){const b=bab(S.mBab)||DB.babs[0];
  return `<h1>${t('material')}</h1>
  ${DB.babs.length?`<div style="margin:12px 0"><select onchange="S.mBab=+this.value;S.editWord=null;render()">${DB.babs.map(x=>`<option value="${x.id}" ${b&&x.id===b.id?'selected':''}>${esc(x.nama)} (${x.words.length})</option>`).join('')}</select></div>`:''}
  <div class="card" style="margin-bottom:14px;display:flex;gap:8px" ${enter('addBab')}><input id="bn" placeholder="${t('babName')}"><button class="btn sm2" type="button" onclick="addBab()">${t('create')}</button></div>
  ${b?`<h2>${t('addWord')}</h2><div class="card" ${enter('addWord')}>
  <div class="field"><label>${t('word')}</label><input id="wk" placeholder="wake up"></div>
  <div class="field"><label>${t('meaning')}</label><input id="wa" placeholder="bangun tidur"></div>
  <div class="field"><label>${t('example')} *</label><input id="wc" placeholder="I wake up at 5 a.m."></div>
  <button class="btn" type="button" onclick="addWord()">${t('save')}</button></div>
  <h2>${t('pasteTitle')}</h2><div class="card"><p class="sm mu" style="margin:0 0 8px">${t('pasteHint')}</p>
  <button class="btn ghost sm2" style="margin-bottom:10px" onclick="copyPrompt()">${t('copyPrompt')}</button>
  <textarea id="pb" placeholder="sweep | menyapu | I sweep the floor."></textarea><div style="height:10px"></div>
  <button class="btn" type="button" onclick="pasteWords()">${t('save')}</button></div>
  <h2>${t('wordList')} <span class="sm mu" style="font-weight:400">· ${t('autoSplit')}</span></h2><p class="sm mu" style="margin:-4px 0 8px">${t('tapEdit')}</p>
  ${b.words.length?Array.from({length:pakets(b)},(_,i)=>{const ws=pkWords(b,i+1);return `${i?'<div class="pksep"></div>':''}<div class="pk"><span>${t('paket')} ${i+1}</span><span>${ws.length}/20</span></div><div class="wl">${ws.map((w,j)=>
    S.editWord===w.id?`<div class="wi" style="display:block" ${enter('saveWord')}>
      <div class="field"><label>${t('word')}</label><input id="ek" value="${esc(w.kata)}"></div>
      <div class="field"><label>${t('meaning')}</label><input id="ea" value="${esc(w.arti)}"></div>
      <div class="field"><label>${t('example')} *</label><input id="ec" value="${esc(w.contoh)}"></div>
      <div style="display:flex;gap:8px"><button class="btn sm2" type="button" onclick="saveWord()">${t('save')}</button><button class="btn ghost sm2" type="button" onclick="S.editWord=null;S.confirm=null;render()">${t('cancel')}</button>
      <span class="grow"></span><button class="btn ghost sm2" style="color:var(--bad)" type="button" onclick="delWord()">${S.confirm==='w'+w.id?t('sureDel'):t('del')}</button></div></div>`:
    `<div class="wi" style="cursor:pointer" onclick="S.editWord=${w.id};S.confirm=null;render()"><span class="no">${i*20+j+1}</span><div class="grow"><b>${esc(w.kata)}</b> <span class="sm mu">· ${esc(w.arti)}</span>${isNew(w)?`<span class="pill">${t('newMark')}</span>`:''}<div class="sm mu">“${esc(w.contoh)}”</div></div><span class="mu sm">${t('edit')}</span></div>`).join('')}</div>`}).join(''):`<div class="card mu">${t('empty')}</div>`}`:''}`}
async function addBab(){const n=$('bn').value.trim();if(!n){toast(t('fill'));return}
  const ok=await run(async()=>{const{data,error}=await sb.from('babs').insert({nama:n.slice(0,80)}).select('id,nama').single();if(error)throw error;DB.babs.push({...data,words:[]});S.mBab=data.id});
  if(ok)toast(t('babCreated'));render()}
async function addWord(){const k=$('wk').value.trim(),a=$('wa').value.trim(),c=$('wc').value.trim();if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const ok=await run(async()=>{const{data,error}=await sb.from('words').insert({bab_id:S.mBab,kata:k,arti:a,contoh:c}).select('id,bab_id,kata,arti,contoh,created_at').single();if(error)throw error;bab(S.mBab).words.push(data)});
  if(ok)toast('1 '+t('wordsAdded'));render()}
function parse(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^\|?\s*:?-{2,}/.test(l)).map(l=>{l=l.replace(/^\|/,'').replace(/\|$/,'');
  let p=(l.includes('\t')?l.split('\t'):l.split('|')).map(x=>x.trim().replace(/^\*\*|\*\*$/g,''));if(/^\d+\.?$/.test(p[0])&&p.length>=4)p.shift();return p}).filter(p=>p.length>=2&&p[0]&&!/^(kata|word|no)$/i.test(p[0]))}
async function pasteWords(){const rows=parse($('pb').value);if(!rows.length){toast(t('nothing'));return}
  const ok=rows.filter(p=>p.slice(2).join('').trim()&&p[1]),skip=rows.length-ok.length;
  if(!ok.length){toast(`${skip} ${t('skipped')}`,3500);return}
  const payload=ok.map(p=>({bab_id:S.mBab,kata:p[0].slice(0,120),arti:p[1].slice(0,200),contoh:p.slice(2).join(' | ').slice(0,400)}));
  const done=await run(async()=>{const{data,error}=await sb.from('words').insert(payload).select('id,bab_id,kata,arti,contoh,created_at');if(error)throw error;
    data.sort((x,y)=>x.id-y.id).forEach(w=>bab(S.mBab).words.push(w))});
  if(done)toast(ok.length+' '+t('wordsAdded')+(skip?` · ${skip} ${t('skipped')}`:''),3500);render()}
async function saveWord(){const k=$('ek').value.trim(),a=$('ea').value.trim(),c=$('ec').value.trim();if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const id=S.editWord;const ok=await run(async()=>{const{error}=await sb.from('words').update({kata:k,arti:a,contoh:c}).eq('id',id);if(error)throw error;
    const w=bab(S.mBab).words.find(x=>x.id===id);Object.assign(w,{kata:k,arti:a,contoh:c})});
  if(ok){S.editWord=null;toast(t('wordSaved'))}render()}
async function delWord(){const id=S.editWord;if(S.confirm!=='w'+id){S.confirm='w'+id;render();return}
  S.confirm=null;const ok=await run(async()=>{const{error}=await sb.from('words').delete().eq('id',id);if(error)throw error;const b=bab(S.mBab);b.words=b.words.filter(x=>x.id!==id)});
  if(ok){S.editWord=null;toast(t('wordDeleted'))}render()}
function copyPrompt(){const txt='Buatkan 20 vocabulary bahasa Inggris tentang [TOPIK] untuk pemula. Tampilkan dalam bentuk tabel 3 kolom TANPA header: Kata Inggris | Arti Indonesia | Contoh kalimat sangat sederhana.';
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(txt,6000))}catch(e){toast(txt,6000)}}

/* ---------- boot ---------- */
function readRole(){try{return location.hash==='#guru'?'teacher':'student'}catch(e){return 'student'}}
window.addEventListener('hashchange',()=>{S.loginTab=readRole();S.err='';if(!S.user)boot()});
async function boot(){S.loginTab=readRole();
  try{
    if(S.loginTab==='teacher'){const{data}=await sb.rpc('teacher_exists');S.needSetup=data===false}
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enterApp(session);render();return}
  }catch(e){console.error(e);await doSignOut()}
  S.view='login';render()}
render();boot();

</script>
</body>
</html>
