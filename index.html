  const sc=()=>base*z,clamp=()=>{const w=img.width*sc(),h=img.height*sc();x=Math.min(0,Math.max(V-w,x));y=Math.min(0,Math.max(V-h,y))},

  x=(V-img.width*base)/2;y=(V-img.height*base)/2;draw();
  const setZ=(nz,cx=V/2,cy=V/2)=>{nz=Math.min(4,Math.max(1,nz));const px=(cx-x)/sc(),py=(cy-y)/sc();z=nz;x=cx-px*sc();y=cy-py*sc();rg.value=z;draw()};
  rg.oninput=()=>setZ(+rg.value);box.onwheel=e=>{e.preventDefault();const r=box.getBoundingClientRect();setZ(z*(e.deltaY<0?1.08:.93),e.clientX-r.left,e.clientY-r.top)};

  box.onpointerdown=e=>{box.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];if(pts.size===2){const[a,b]=[...pts.values()];dist0=Math.hypot(a[0]-b[0],a[1]-b[1]);z0=z}};

/* ---------- data loading ---------- */
async function loadData(){
  const uid=S.user.id;
  const [babs,words]=await Promise.all([fetchAll('babs','id,nama'),fetchAll('words','id,bab_id,kata,arti,contoh,contoh_arti,tanda,created_at')]);
  DB.grammars=await fetchAll('grammars','id,key,judul,level,grup,rumus,penjelasan,detail,contoh,audio_path,audio_dur');gIdx();
  DB.wa='';try{const{data}=await sb.from('app_settings').select('value').eq('key','wa').maybeSingle();DB.wa=(data&&data.value)||''}catch(e){console.warn(e)}
  DB.gstats={};try{(await fetchAll('grammar_stats','student_id,grammar_key,benar,total','grammar_key')).forEach(r=>{(DB.gstats[r.student_id]=DB.gstats[r.student_id]||{})[r.grammar_key]=r})}catch(e){console.warn(e)}
  DB.babs=babs.map(b=>({...b,words:words.filter(w=>w.bab_id===b.id)}));
  const [unl,sts,qz]=await Promise.all([fetchAll('unlocks','student_id,bab_id,paket','bab_id'),fetchAll('statuses','student_id,word_id,status','word_id'),fetchAll('quiz_results','student_id,bab_id,paket,last,best,tries','bab_id')]);
  let studs;
  if(S.role==='teacher'){const{data,error}=await sb.from('profiles').select('id,nama,username,foto,bio,glevel,last_seen,created_at').eq('role','student').order('created_at');if(error)throw error;studs=data}
  else studs=[{id:uid,nama:S.user.nama,username:S.user.username,foto:S.user.foto,bio:S.user.bio||'',glevel:S.user.glevel,glevel_seen:S.user.glevel_seen}];
  DB.students=studs.map(p=>({...p,unlocked:{},status:{},quiz:{}}));
  const byId=Object.fromEntries(DB.students.map(s=>[s.id,s]));
  unl.forEach(u=>{if(byId[u.student_id])byId[u.student_id].unlocked[u.bab_id]=u.paket});
  sts.forEach(x=>{if(byId[x.student_id])byId[x.student_id].status[x.word_id]=x.status});
  qz.forEach(q=>{if(byId[q.student_id])byId[q.student_id].quiz[q.bab_id+'-'+q.paket]={last:q.last,best:q.best,tries:q.tries}});
  if(S.role==='student')S.user=byId[uid];
  if(!S.mBab&&DB.babs[0])S.mBab=DB.babs[0].id;
  await signFotos();
}
async function enterApp(session){
  const{data:prof,error}=await sb.from('profiles').select('id,role,nama,username,foto,bio,glevel,glevel_seen').eq('id',session.user.id).maybeSingle();
  if(error)throw error;
  if(!prof){await sb.auth.signOut();throw new Error(t('notStudent'))}
  S.role=prof.role;S.user=prof;
  await loadData();
  if(S.role==='teacher'){S.view='admin';S.aTab='sum';S.gStudent=DB.students[0]?.id||null}else{S.view='home';glNotify()}
  presStart();
  if(S.role==='student'){loadFriends();clearInterval(S.frIv);S.frIv=setInterval(()=>{if(document.visibilityState==='visible')loadFriends()},60000)}
}
function myGL(){return S.role==='teacher'?3:(S.user&&S.user.glevel)||1}
function glNotify(){const u=S.user,g=u.glevel||1;if(g>(u.glevel_seen||1)){setTimeout(()=>ask(t('glUpTitle'),`${t('glUpMsg')} <b>${t('lv'+g)}</b>.`,t('ok'),false,true).catch(()=>{}),400);
  u.glevel_seen=g;sb.from('profiles').update({glevel_seen:g}).eq('id',u.id).then(()=>{},()=>{})}}

function renderNav(){let items=[];

    items=[['home',t('yourBabs'),"goHome()",S.view==='home'],['book',t('learn'),"navBab('learn')",inB&&S.tab==='learn'],['chart',t('score'),"navBab('score')",inB&&S.tab==='score']]}
  else if(S.role==='teacher'&&S.view==='admin')items=[['home',t('summary'),"aTab('sum')",S.aTab==='sum'||S.aTab==='grade'],['users',t('students'),"aTab('stu')",S.aTab==='stu'],['file',t('material'),"aTab('mat')",S.aTab==='mat'],['gram',t('grammar'),"aTab('gram')",S.aTab==='gram']];

async function doLogin(){const u=$('u').value.trim().toLowerCase(),p=$('p').value.trim();
  if(!u||!p){S.err=t('fill');return render()}
  const teacher=S.loginTab==='teacher'||u.includes('@');
  const ok=await run(async()=>{
    const{data,error}=teacher?await sb.auth.signInWithPassword({email:u,password:p}):await sb.auth.signInWithPassword({email:`${u}@${STUDENT_DOMAIN}`,password:pinToPw(u,p)});
    if(error){S.err=teacher?t('wrongT'):t('wrong');return}
    await enterApp(data.session);
    if(S.role==='teacher'&&!teacher){await doSignOut();S.err=t('notTeacherUrl')}
  },false);
  render()}
async function doSetup(){const n=$('sn').value.trim(),e=$('u').value.trim().toLowerCase(),p=$('p').value;
  if(!n||!e||!p){S.err=t('fill');return render()}if(p.length<8){S.err=t('pwMin');return render()}
  await run(async()=>{await invokeAdmin({action:'setup_teacher',nama:n,email:e,password:p});
    const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;S.needSetup=false;await enterApp(data.session)});
  render()}
async function doSignOut(){presStop();clearInterval(S.frIv);DB.friends=[];S.fRes=undefined;S.fq='';try{await sb.auth.signOut()}catch(e){}Object.assign(S,{user:null,role:null,view:'login'});DB.babs=[];DB.students=[]}

  ${list.length?list.map((b,i)=>{const open=s.unlocked[b.id];const tot=open?Math.min(b.words.length,open*20):b.words.length;

async function addStu(){const n=$('sn').value.trim(),u=$('su').value.trim().toLowerCase(),p=$('sp').value.trim();
  if(!n||!u||!p){S.err=t('fill');return render()}
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){S.err='Username 3–20 karakter: huruf kecil, angka, titik, atau garis bawah.';return render()}

function legend(){return `<div class="legend">${GRP.map(g=>`<span class="g-${g}"><i class="gdot"></i>${t('grp_'+g)}</span>`).join('')}</div>`}
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function parseMarks(str){const marks=[];const plain=String(str||'').replace(/\[([^\[\]|]+)\|([a-z0-9-]+)(?:\|([^\[\]]*))?\]/gi,(m,tx,key,d)=>{key=key.toLowerCase();
    if(marks.length<2&&GB[key])marks.push({t:tx.trim(),g:key,d:(d||'').split(',').map(x=>x.trim()).filter(x=>x&&norm(x)!==norm(tx)).slice(0,3)});return tx});
  return{plain:plain.replace(/\s+/g,' ').trim(),marks}}
function markRanges(s,tanda){const r=[];(tanda||[]).forEach(m=>{if(!m||!m.t)return;const re=new RegExp("(^|[^\\w'])("+reEsc(m.t)+")(?![\\w'])",'i');const mm=re.exec(s);if(!mm)return;
  const a=mm.index+mm[1].length,b=a+mm[2].length;if(r.some(x=>a<x.b&&b>x.a))return;r.push({a,b,m})});return r.sort((x,y)=>x.a-y.a)}
function cs(w){const s=w.contoh||'',r=markRanges(s,w.tanda);if(!r.length)return esc(s);let o='',p=0;
  r.forEach(x=>{const g=GB[x.m.g];o+=esc(s.slice(p,x.a))+(g?`<span class="gm g-${g.grup}" onclick="gTip(event,'${x.m.g}')">${esc(s.slice(x.a,x.b))}</span>`:esc(s.slice(x.a,x.b)));p=x.b});return o+esc(s.slice(p))}

function closeTip(){const d=$('gtip');if(d)d.remove()}
function gTip(e,key){e.stopPropagation();const g=GB[key];if(!g)return;closeTip();const el=e.currentTarget,d=document.createElement('div');d.className='gtip g-'+g.grup;d.id='gtip';
  const ex=(g.contoh||'').split('\n').filter(Boolean)[0];d.onclick=ev=>ev.stopPropagation();

  document.body.appendChild(d);tipY=scrollY;const vw=innerWidth,w=Math.min(320,vw-24);d.style.width=w+'px';const rc=el.getBoundingClientRect(),h=d.offsetHeight;
  d.style.left=Math.max(12,Math.min(vw-w-12,rc.left+rc.width/2-w/2))+'px';d.style.top=(rc.bottom+8+h<innerHeight?rc.bottom+8:Math.max(12,rc.top-h-8))+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('#gtip'))closeTip()});let tipY=0;addEventListener('scroll',()=>{if(Math.abs(scrollY-tipY)>40)closeTip()},{passive:true});
function openGram(key){if(S.role==='teacher'){aTab('gram');S.gOpen=key;render()}else{const b=bab(S.bab);if(S.tab!=='learn'){S.gPrevTab=S.tab;S.tab='learn';S.gPrev='menu'}else if(S.mode!=='gram')S.gPrev=S.mode;S.mode='gram';S.gOpen=key;S.gAll=!b||!bGrams(b).some(g=>g.key===key);render()}

function gramBody(q,onpick,oncheck){const g=GB[q.m.g]||{grup:'other',judul:q.m.g,penjelasan:''};

function vGlat(){const G=S.glat,g=GB[G.key]||{judul:G.key,grup:'other'};const back=`<button class="back" onclick="S.mode='gram';S.gOpen='${G.key}';render()">${ic('chevl',16)}${t('grammar')}</button>`;

const RUMUS_ID={s:'subjek',subject:'subjek',subjek:'subjek',o:'objek',object:'objek',objek:'objek',v:'kata kerja',verb:'kata kerja',v1:'kata kerja bentuk satu',v2:'kata kerja bentuk dua',v3:'kata kerja bentuk tiga',

  'v-ed':'kata kerja ditambah e-de','verb-ed':'kata kerja ditambah e-de',adj:'kata sifat',adjective:'kata sifat',adv:'kata keterangan',adverb:'kata keterangan',n:'kata benda',noun:'kata benda',k:'keterangan',ket:'keterangan'};
function rumusParts(r){const out=[];String(r||'').split(/(\+|\/|,|\(|\)|\s+)/).forEach(x=>{x=(x||'').trim();if(!x||x==='('||x===')'||x===',')return;
  if(x==='+')out.push({l:'id',t:'ditambah'});else if(x==='/')out.push({l:'id',t:'atau'});
  else{const k=x.toLowerCase().replace(/[.?!:;]+$/,'');if(RUMUS_ID[k])out.push({l:'id',t:RUMUS_ID[k]});else if(/[a-z]/i.test(k))out.push({l:'en',t:k})}});return out}
function mergeParts(P){const o=[];P.forEach(p=>{const L=o[o.length-1];if(L&&L.l===p.l&&L.f&&p.f)L.t+=', '+p.t;else o.push({...p})});return o}
function gramParts(g,short,sent){const ex=(g.contoh||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const P=[{l:'en',t:g.judul},{l:'id',t:g.penjelasan}];
  if(short){const s=sent||ex[0];if(s)P.push({l:'id',t:'Contohnya'},{l:'en',t:s})}
  else{if(g.rumus)P.push({l:'id',t:'Rumusnya'},...rumusParts(g.rumus).map(x=>({...x,f:1})));if(g.detail)P.push({l:'id',t:g.detail});
    if(ex.length){P.push({l:'id',t:'Contohnya'});ex.forEach(x=>P.push({l:'en',t:x}))}}
  return mergeParts(P.filter(p=>p.t&&String(p.t).trim()))}
function pickVoice(l){try{const vs=speechSynthesis.getVoices();if(l==='id')return vs.find(v=>/^(id|in)([-_]|$)/i.test(v.lang))||null;return vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){return null}}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>{})}catch(e){}
function segsOf(parts){return parts.flatMap(p=>String(p.t).split(/(?<=[.!?;])\s+/).filter(Boolean).map(t=>({l:p.l,t})))}

  const segs=segsOf(parts),tot=segs.reduce((a,p)=>a+segEst(p),0),us=segs.map(mkUtt);

function ttsInfo(id){if(S.tts&&S.tts.key===id)return S.tts;const g=GB[id];if(!g)return null;const segs=segsOf(gramParts(g,false)),est=segs.map(segEst);let c=0;const cum=est.map(e=>{const v=c;c+=e;return v});
  return{key:id,segs,est,cum,tot:c,idx:0,playing:false,t0:0,drag:null}}
function ttsDur(id){const T=ttsInfo(id);return T?T.tot:0}
function ttsPos(T){if(!T)return 0;if(T.drag!=null)return T.drag;return Math.min(T.tot,T.cum[T.idx]+(T.playing?Math.min(T.est[T.idx],(Date.now()-T.t0)/1000):0))}

  try{T.segs.slice(T.idx).forEach((p,k)=>{const i=T.idx+k,u=mkUtt(p);u.onstart=()=>{if(S.ttsGen===gen){T.idx=i;T.t0=Date.now()}};
    if(i===last)u.onend=()=>{if(S.ttsGen===gen)ttsEnd()};speechSynthesis.speak(u)})}catch(e){toast(t('audioErr'));ttsEnd();return}
  clearInterval(S.ttsIv);S.ttsIv=setInterval(()=>{if(S.ttsGen!==gen||!T.playing){clearInterval(S.ttsIv);return}
    if((Date.now()-T.t0)/1000>T.est[T.idx]*3+4&&!speechSynthesis.speaking)ttsEnd();else vcUI(id)},250);vcUI(id)}

function audDur(id){const a=S.audKey===id?S.aud:null;if(a&&isFinite(a.duration)&&a.duration>0)return a.duration;if(id==='rev')return S.recG?S.recG.sec:0;return (GB[id]||{}).audio_dur||0}
function wbars(seed,n,p){let h=7;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;let o='';
  for(let i=0;i<n;i++){h=(h*1103515245+12345)>>>0;const env=.35+.65*Math.sin(Math.PI*(i+.5)/n),v=Math.round(18+env*(30+(h%1000)/1000*52));o+=`<i class="${(i+.5)/n<=p?'on':''}" style="height:${Math.min(100,v)}%;--d:${((h>>8)%10)/10}s"></i>`}return o}

const waUrl=msg=>`https://wa.me/${DB.wa}?text=${encodeURIComponent(msg)}`;
function waBtn(msg,cls=''){if(S.role!=='student'||!DB.wa)return '';return `<a class="wabtn ${cls}" href="${esc(waUrl(msg))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('chat',16)} ${t('askWa')}</a>`}
const waGram=g=>waHi()+(lang==='en'?`I have a question about the grammar "${g.judul}": `:`Saya mau tanya soal grammar "${g.judul}": `);
function waQuiz(q,g){const ans=q.gopts&&q.gopts[q.gp];return waHi()+(lang==='en'?`I have a question about the grammar "${g.judul}".\nQuestion: ${q.blank}\nMy answer: ${ans||'-'}\nCorrect answer: ${q.m.t}\nMy question: `:`Saya mau tanya soal grammar "${g.judul}".\nSoal: ${q.blank}\nJawaban saya: ${ans||'-'}\nJawaban benar: ${q.m.t}\nPertanyaan saya: `)}
async function saveWa(){const raw=$('myWa').value.trim(),v=raw?waNum(raw):'';if(raw&&(v.length<10||v.length>15)){toast(t('waBad'),3000);return}
  const ok=await run(async()=>{const{error}=await sb.from('app_settings').upsert({key:'wa',value:v,updated_at:new Date().toISOString()});if(error)throw error;DB.wa=v});
  if(ok){S.meWa=false;renderMe();toast(v?t('waSaved'):t('waCleared'))}}
/* --- tag grammar widget (add / edit forms) --- */
function tgSent(k){const el=$(k==='add'?'wc':'ec');return el?el.value:''}
function tgW(k,sent){S.tgs=S.tgs||{};const st=S.tgs[k]||(S.tgs[k]={marks:[],sel:null});const toks=(sent||'').split(/\s+/).filter(Boolean);
  if(!toks.length)return `<div class="sm mu">${t('tgHint')}</div><div class="sm mu" style="margin-top:6px">${t('tgType')}</div>`;
  const rg=markRanges(sent,st.marks);let pos=0;const info=toks.map(tk=>{const a=sent.indexOf(tk,pos);pos=a+tk.length;const m=rg.find(r=>a<r.b&&a+tk.length>r.a);return m?GB[m.m.g]:null});
  const inSel=i=>st.sel&&i>=st.sel[0]&&i<=st.sel[1];
  return `<div class="sm mu">${t('tgHint')}</div><div class="toks">${toks.map((tk,i)=>`<button type="button" class="tok ${inSel(i)?'sel':''} ${info[i]?'mk g-'+info[i].grup:''}" onclick="tgTap('${k}',${i})">${esc(tk)}</button>`).join('')}</div>
  ${st.sel?`<div class="tgf"><div class="sm"><b>“${esc(tgText(toks,st.sel))}”</b></div><select id="tgg_${k}"><option value="">${t('tgPick')}</option>${[1,2,3].map(l=>`<optgroup label="${t('lv'+l)}">${DB.grammars.filter(g=>g.level===l).map(g=>`<option value="${g.key}">${esc(g.judul)}</option>`).join('')}</optgroup>`).join('')}</select>
    <input id="tgd_${k}" placeholder="${t('tgWrong')}"><div class="row"><button type="button" class="btn sm2" onclick="tgSet('${k}')">${t('tgSet')}</button><button type="button" class="btn ghost sm2" onclick="S.tgs['${k}'].sel=null;tgRef('${k}')">${t('cancel')}</button></div></div>`:''}
  ${rg.length?`<div class="chips">${rg.map(r=>{const g=GB[r.m.g];return `<span class="chip g-${g?g.grup:'other'}">${esc(r.m.t)} · ${esc(g?g.judul:r.m.g)}${r.m.d&&r.m.d.length?` <span class="mu">(${esc(r.m.d.join(', '))})</span>`:''}<button type="button" aria-label="${t('del')}" onclick="tgDel('${k}','${jsq(r.m.t)}')">×</button></span>`}).join('')}</div>`:''}`}
function tgText(toks,sel){return toks.slice(sel[0],sel[1]+1).join(' ').replace(/^[^\w']+|[^\w']+$/g,'')}
function tgRef(k){const el=$('tgw_'+k);if(el)el.innerHTML=tgW(k,tgSent(k))}
function tgTap(k,i){const st=S.tgs[k];if(st.marks.length>=2&&!st.sel){toast(t('tgMax'));return}
  if(st.sel&&(i===st.sel[1]+1))st.sel=[st.sel[0],i];else if(st.sel&&i===st.sel[0]-1)st.sel=[i,st.sel[1]];else if(st.sel&&st.sel[0]===i&&st.sel[1]===i)st.sel=null;else st.sel=[i,i];tgRef(k)}
function tgSet(k){const st=S.tgs[k],g=$('tgg_'+k).value,d=$('tgd_'+k).value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,3);
  if(!g||d.length<2){toast(t('tgNeed'));return}const toks=tgSent(k).split(/\s+/).filter(Boolean),tx=tgText(toks,st.sel);if(!tx)return;
  st.marks=st.marks.filter(m=>norm(m.t)!==norm(tx));st.marks.push({t:tx,g,d:d.filter(x=>norm(x)!==norm(tx))});st.marks=st.marks.slice(-2);st.sel=null;tgRef(k)}
function tgDel(k,tx){const st=S.tgs[k];st.marks=st.marks.filter(m=>m.t!==tx);tgRef(k)}
function norm(x){return String(x||'').toLowerCase().replace(/\s+/g,' ').replace(/[.!?,]+$/,'').trim()}
function dupsOf(kata,exceptId){const k=norm(kata),r=[];DB.babs.forEach(b=>b.words.forEach(w=>{if(w.id!==exceptId&&norm(w.kata)===k)r.push({w,b})}));return r}
function dupMsg(kata,d){return `<b>${esc(kata)}</b> ${t('alreadyAs')} ${d.map(x=>`“${esc(x.w.arti)}” (${esc(x.b.nama)})`).join(', ')}. ${t('addAsNew')}`}
function senseNo(w){const k=norm(w.kata),same=[];DB.babs.forEach(b=>b.words.forEach(x=>{if(norm(x.kata)===k)same.push(x.id)}));if(same.length<2)return 0;same.sort((a,b)=>a-b);return same.indexOf(w.id)+1}
function kw(w){const n=senseNo(w);return esc(w.kata)+(n?` <span class="sense">${'①②③④⑤⑥⑦⑧⑨'[n-1]||n}</span>`:'')}
function others(w,ws,n,extra=()=>true){const usedK=new Set([norm(w.kata)]),usedA=new Set([norm(w.arti)]),r=[];
  for(const x of shuffle(ws.filter(x=>x.id!==w.id&&extra(x)))){const k=norm(x.kata),a=norm(x.arti);if(usedK.has(k)||usedA.has(a))continue;usedK.add(k);usedA.add(a);r.push(x);if(r.length>=n)break}return r}
function splitBar(l){const out=[];let cur='',d=0;for(const ch of l){if(ch==='[')d++;else if(ch===']')d=Math.max(0,d-1);if(ch==='|'&&!d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function parse(txt){return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^\|?\s*:?-{2,}/.test(l)).map(l=>{l=l.replace(/^\|/,'').replace(/\|$/,'');
  let p=(l.includes('\t')?l.split('\t'):splitBar(l)).map(x=>x.trim().replace(/^\*\*|\*\*$/g,''));if(/^\d+\.?$/.test(p[0])&&p.length>=4)p.shift();return p}).filter(p=>p.length>=2&&p[0]&&!/^(kata|word|no)$/i.test(p[0]))}
async function pasteWords(){const rows=parse($('pb').value);if(!rows.length){toast(t('nothing'));return}
  const valid=rows.filter(p=>(p[2]||'').trim()&&p[1]),skip=rows.length-valid.length,seen=new Set(),fresh=[],exist=[];let inDup=0;
  valid.forEach(p=>{const k=norm(p[0]);if(seen.has(k)){inDup++;return}seen.add(k);const d=dupsOf(p[0]);(d.length?exist:fresh).push(d.length?{p,d}:p)});
  const toRow=p=>{const pm=parseMarks(p[2]);return{bab_id:S.mBab,kata:p[0].slice(0,120),arti:p[1].slice(0,200),contoh:pm.plain.slice(0,400),contoh_arti:p.slice(3).join(' | ').trim().slice(0,400),tanda:cleanMarks(pm.plain,pm.marks)}};
  const ins=async list=>{if(!list.length)return true;return await run(async()=>{const{data,error}=await sb.from('words').insert(list.map(toRow)).select('id,bab_id,kata,arti,contoh,contoh_arti,tanda,created_at');if(error)throw error;
    data.sort((x,y)=>x.id-y.id).forEach(w=>bab(S.mBab).words.push(w))})};
  if(!fresh.length&&!exist.length){toast(`${skip} ${t('skipped')}`,3500);return}
  let added=0;if(fresh.length){if(!await ins(fresh)){render();return}added=fresh.length;$('pb').value=''}
  let extra=0,left=exist.length;
  if(exist.length){render();$('toast').classList.remove('show');const picked=await askPick(exist);if(picked.length&&await ins(picked.map(i=>exist[i].p))){extra=picked.length;left-=picked.length}}
  const parts=[];if(added+extra)parts.push(`${added+extra} ${t('wordsAdded')}`);if(extra)parts.push(`${extra} ${t('asNewSense')}`);
  if(left)parts.push(`${left} ${t('notAdded')}`);if(inDup)parts.push(`${inDup} ${t('dupInPaste')}`);if(skip)parts.push(`${skip} ${t('skipped')}`);
  toast(parts.join(' · ')||t('nothing'),4500);render()}
function askPick(exist){return new Promise(res=>{const o=document.createElement('div');o.className='mdl';
  o.innerHTML=`<div class="mdl-b wide"><b>${t('pickTitle')}</b><p class="sm mu">${t('pickMsg')}</p><div class="pk-l">${exist.map((e,i)=>`<label class="pk-i"><input type="checkbox" data-i="${i}">
    <div><b>${esc(e.p[0])}</b><div class="sm"><span class="mu">${t('oldMeaning')}:</span> ${e.d.map(x=>esc(x.w.arti)).join(', ')}</div><div class="sm"><span class="mu">${t('newMeaning')}:</span> <span style="color:var(--ac)">${esc(e.p[1])}</span></div></div></label>`).join('')}</div>
    <div class="mdl-a"><button class="btn ghost sm2" data-v="0">${t('skipAll')}</button><button class="btn sm2" data-v="1">${t('save')}</button></div></div>`;
  o.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const sel=b.dataset.v==='1'?[...o.querySelectorAll('input:checked')].map(x=>+x.dataset.i):[];o.remove();res(sel)};
  document.body.appendChild(o)})}
async function saveWord(){const k=$('ek').value.trim(),a=$('ea').value.trim(),c=$('ec').value.trim(),ca=$('eca').value.trim().slice(0,400);if(!k||!a){toast(t('fill'));return}if(!c){toast(t('needSentence'));return}
  const id=S.editWord,w0=bab(S.mBab).words.find(x=>x.id===id);const tanda=cleanMarks(c,(S.tgs&&S.tgs['e'+id]||{}).marks);
  if(w0.kata===k&&w0.arti===a&&w0.contoh===c&&(w0.contoh_arti||'')===ca&&JSON.stringify(w0.tanda||null)===JSON.stringify(tanda)){S.editWord=null;render();return}
  const d=norm(k)!==norm(w0.kata)?dupsOf(k,id):[];
  if(d.length){if(!await ask(t('dupTitle'),dupMsg(k,d).replace(t('addAsNew'),t('saveAsNew')),t('saveNew')))return}
  else if(!await ask(t('askSave'),`<b>${esc(w0.kata)}</b>${w0.kata!==k?' → <b>'+esc(k)+'</b>':''}. ${t('askSaveMsg')}`,t('save')))return;
  const ok=await run(async()=>{const{error}=await sb.from('words').update({kata:k,arti:a,contoh:c,contoh_arti:ca,tanda}).eq('id',id);if(error)throw error;
    const w=bab(S.mBab).words.find(x=>x.id===id);Object.assign(w,{kata:k,arti:a,contoh:c,contoh_arti:ca,tanda})});
  if(ok){S.editWord=null;toast(t('wordSaved'))}render()}
async function delWord(){const id=S.editWord,w0=bab(S.mBab).words.find(x=>x.id===id);if(!await ask(t('askDelWord'),`<b>${esc(w0.kata)}</b> ${t('askDelWordMsg')}`,t('del'),true))return;const ok=await run(async()=>{const{error}=await sb.from('words').delete().eq('id',id);if(error)throw error;const b=bab(S.mBab);b.words=b.words.filter(x=>x.id!==id)});
  if(ok){S.editWord=null;toast(t('wordDeleted'))}render()}
function topGL(){return Math.max(1,...DB.students.map(x=>x.glevel||1))}
function focusChips(){const L=S.pLvl||1,f=S.pFocus||[];return DB.grammars.filter(g=>g.level<=L).map(g=>{const z=!gUse(g.key)&&g.level<=topGL();return `<button type="button" class="fchip g-${g.grup} ${f.includes(g.key)?'on':''}" onclick="togFocus('${g.key}')">${z?'⚠ ':''}${esc(g.judul)}</button>`}).join('')+`<div class="sm mu" style="width:100%;margin-top:2px">${t('focusHint')}</div>`}
function togFocus(k){let f=S.pFocus||[];if(f.includes(k))f=f.filter(x=>x!==k);else{if(f.length>=3){toast(t('focusMax'));return}f=[...f,k]}S.pFocus=f;$('pfoc').innerHTML=focusChips()}
function gramRule(maxLvl){const gl=DB.grammars.filter(g=>g.level<=maxLvl);if(!gl.length)return'';
  return `\n\nTANDAI GRAMMAR di contoh kalimat: tandai maksimal 2 bagian kalimat yang menunjukkan grammar dari daftar di bawah, dengan format [teks|kode|3 pilihan salah dipisah koma]. Contoh: She [goes|simple-present|go,going,went] to the park. Teks di dalam tanda harus persis sama dengan kata di kalimat. Pilihan salah harus bentuk lain dari kata itu yang masuk akal tapi salah untuk kalimat tersebut. Hanya pakai kode berikut:\n${gl.map(g=>`${g.key} = ${g.judul}`).join('\n')}`}
const PLVL={1:['pemula (beginner)','kata sehari-hari yang paling dasar','sangat sederhana, 3–6 kata'],2:['menengah (intermediate)','kata yang lebih beragam, termasuk phrasal verb umum','sedang, 6–10 kata'],3:['lanjut (advanced)','kata dan ungkapan yang lebih sulit, idiom ringan, kata formal','lebih panjang dan natural, 8–15 kata']};
function copyPrompt(){const L=PLVL[S.pLvl||1],m=!!S.pSense;
  const byK={};DB.babs.forEach(b=>b.words.forEach(w=>{const k=w.kata.trim();(byK[k]=byK[k]||[]).push(w.arti)}));const ks=Object.keys(byK);
  let txt=`Buatkan 20 vocabulary bahasa Inggris tentang [TOPIK] untuk tingkat ${L[0]}: ${L[1]}. Tampilkan dalam bentuk tabel 4 kolom TANPA header: Kata Inggris | Arti Indonesia | Contoh kalimat (${L[2]}) | Arti contoh kalimat dalam bahasa Indonesia.`;
  if(ks.length)txt+=m?`\n\nKata-kata berikut sudah pernah dipelajari beserta artinya (${ks.length} kata). Kamu BOLEH memakai kata yang sama HANYA jika maknanya berbeda dari arti yang tertulis, dan contoh kalimatnya harus jelas menunjukkan makna baru itu. Selain itu, jangan ulangi kata-kata ini:\n${ks.map(k=>`${k} (${byK[k].join('; ')})`).join(', ')}`
    :`\n\nJANGAN gunakan kata-kata berikut karena sudah pernah dipelajari (${ks.length} kata):\n${ks.join(', ')}`;
  txt+=gramRule((S.pLvl||1));
  const fk=(S.pFocus||[]).filter(k=>GB[k]);if(fk.length)txt+=`\n\nFOKUS GRAMMAR: minimal 14 dari 20 contoh kalimat HARUS memakai grammar berikut (bagi rata), dan tandai grammar tersebut dengan format di atas: ${fk.map(k=>`${k} = ${GB[k].judul}`).join(', ')}.`;
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(txt,6000))}catch(e){toast(txt,6000)}}

/* ---------- boot ---------- */
function readRole(){try{return location.hash==='#guru'?'teacher':'student'}catch(e){return 'student'}}
window.addEventListener('hashchange',()=>{S.loginTab=readRole();S.err='';if(!S.user)boot()});
async function boot(){S.loginTab=readRole();
  try{
    if(S.loginTab==='teacher'){const{data}=await sb.rpc('teacher_exists');S.needSetup=data===false}
    const{data:{session}}=await sb.auth.getSession();
    if(session){await enterApp(session);render();return}
  }catch(e){console.error(e);await doSignOut()}
  S.view='login';S.anim=true;render()}
render();boot();

</script>
